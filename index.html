<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaySlip Tracker — ระบบคำนวณค่าแรงรายวันและสลิปเงินเดือน</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Thai"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

    const DAY_TYPES = {
      work: { label: '✅ วันทำงานปกติ', pay: 1 },
      pubwork: { label: '🎌 นักขัตฤกษ์ (มาทำงาน)', pay: 1 },
      puboff: { label: '🎏 นักขัตฤกษ์ (หยุด)', pay: 1 },
      holiday: { label: '🏖️ วันหยุดประจำสัปดาห์ (0 หน่วยวัน/ไม่ได้ค่าแรง)', pay: 0 },
      sick: { label: '🤒 ลาป่วย (ได้เงิน)', pay: 1 },
      personal: { label: '📄 ลากิจ (ได้เงิน)', pay: 1 },
      annual: { label: '🌴 ลาพักร้อน', pay: 1 },
      absent: { label: '❌ ขาดงาน (ไม่ได้รับค่าจ้าง)', pay: 0 },
      unpaid: { label: '⛔ ลาไม่รับค่าจ้าง', pay: 0 },
    };

    const DEFAULT_SETTINGS = {
      rate: 412,
      hours: 8,
      holMult: 2,
      sso: 5,
      ssoCap: 750,
      tax: 0,
      oth: 0,
      ssoBase: 'wage',
      incomeGoal: 15000,
    };

    function formatMoney(val) {
      const n = typeof val === 'number' && !isNaN(val) ? val : 0;
      return n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function generatePeriodInfo(year, month, half) {
      const lastDay = new Date(year, month, 0).getDate();
      const startDay = half === 1 ? 1 : 16;
      const endDay = half === 1 ? 15 : lastDay;
      const payDateObj = half === 1 ? new Date(year, month - 1, 20) : new Date(year, month, 5);
      const pad = (n) => String(n).padStart(2, '0');
      const payMonth = payDateObj.getMonth() + 1;
      const payYear = payDateObj.getFullYear();

      return {
        y: year,
        m: month,
        half,
        startDay,
        endDay,
        key: `${year}-${pad(month)}-H${half}`,
        label: `${startDay}–${endDay} ${TH_MONTHS[month - 1]} ${year + 543}`,
        payDate: `${payYear}-${pad(payMonth)}-${pad(payDateObj.getDate())}`,
        payLabel: `${payDateObj.getDate()} ${TH_MONTHS[payMonth - 1]} ${payYear + 543}`,
      };
    }

    function generateInitialDays(period) {
      const days = [];
      const pad = (n) => String(n).padStart(2, '0');
      for (let d = period.startDay; d <= period.endDay; d++) {
        const dt = new Date(period.y, period.m - 1, d);
        days.push({
          d,
          dow: dt.getDay(),
          dateStr: `${period.y}-${pad(period.m)}-${pad(d)}`,
          type: 'work',
          unpaidHours: 0,
        });
      }
      return days;
    }

    // 🎯 สูตรคำนวณตรงตามสลิปตัวอย่าง 100%
    function calculatePayroll(period, days, settings, extras) {
      let work = 0, pubW = 0, pubO = 0, holiday = 0, sick = 0, personal = 0, annual = 0, absent = 0, unpaid = 0;
      let unHr = 0, ssoUnHr = 0, pubUnHr = 0;
      let wageUnits = 0, ssoWageUnits = 0;

      days.forEach((day) => {
        const t = day.type;
        const dHr = Math.max(0, day.unpaidHours || 0);

        switch (t) {
          case 'work':
            work++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'pubwork':
            pubW++; wageUnits += settings.holMult; pubUnHr += dHr; unHr += dHr; break;
          case 'puboff':
            pubO++; wageUnits += 1; pubUnHr += dHr; unHr += dHr; break;
          case 'holiday':
            holiday++; /* 0 หน่วยวัน */ break;
          case 'sick':
            sick++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'personal':
            personal++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'annual':
            annual++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'absent':
            absent++; break;
          case 'unpaid':
            unpaid++; break;
        }
      });

      const hourRate = settings.rate / (settings.hours || 8);
      const ssoUnpaidCut = Number((ssoUnHr * hourRate).toFixed(2));
      const pubUnpaidCut = Number((pubUnHr * hourRate).toFixed(2));
      const unpaidCut = Number((unHr * hourRate).toFixed(2));

      // 1. ค่าแรงรายวันปกติ (ฐานคิดประกันสังคมโดยเฉพาะ เช่น 11 วัน x 412 = 4,532.00 ฿)
      const dailyWage = Math.max(0, Number((ssoWageUnits * settings.rate - ssoUnpaidCut).toFixed(2)));

      // 2. ค่าทำงานในวันหยุด 1เท่า (เช่น 412.00 ฿)
      const holidayWorkUnits = pubW * Math.max(0, settings.holMult - 1);
      const holidayWorkPay = Number((holidayWorkUnits * settings.rate).toFixed(2));

      // 3. ค่าแรงทำงานในวันหยุดประเพณี (เช่น 412.00 ฿)
      const pubHolidayUnits = pubW + pubO;
      const pubHolidayPay = Math.max(0, Number((pubHolidayUnits * settings.rate - pubUnpaidCut).toFixed(2)));

      // ยอดรวมค่าแรง
      const wage = Math.max(0, Number((dailyWage + holidayWorkPay + pubHolidayPay).toFixed(2)));

      const validExtras = (extras || []).filter(e => (e.amt || 0) > 0);
      const extraSum = Number(validExtras.reduce((sum, item) => sum + Number(item.amt || 0), 0).toFixed(2));
      const gross = Number((wage + extraSum).toFixed(2));

      // 🎯 ประกันสังคม 5%: คิดจาก dailyWage เท่านั้น (4,532 ฿) ได้ 227 ฿ ไม่รวมยอดวันหยุด
      const ssoBaseAmount = settings.ssoBase === 'all' ? Math.max(0, Number((dailyWage + extraSum).toFixed(2))) : dailyWage;
      let sso = Math.round(ssoBaseAmount * ((settings.sso || 0) / 100));
      if (settings.ssoCap > 0) sso = Math.min(sso, settings.ssoCap);

      const tax = Number((settings.tax || 0).toFixed(2));
      const oth = Number((settings.oth || 0).toFixed(2));
      const ded = Number((sso + tax + oth).toFixed(2));
      const net = Number((gross - ded).toFixed(2));

      return {
        key: period.key,
        period,
        settings,
        days,
        stats: { work, pubW, pubO, holiday, sick, personal, annual, absent, unpaid, paidDays: work + pubW + pubO + sick + personal + annual, unpaidHours: unHr, wageUnits, ssoWageUnits },
        wage,
        dailyWage,
        holidayWorkPay,
        pubHolidayPay,
        pubWage: holidayWorkPay + pubHolidayPay,
        unpaidCut,
        gross,
        sso,
        ssoBaseAmount,
        tax,
        ded,
        net,
      };
    }

    function App() {
      const [isDark, setIsDark] = useState(true);
      const now = new Date();
      const defaultMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const [selectedMonth, setSelectedMonth] = useState(defaultMonthStr);
      const [selectedHalf, setSelectedHalf] = useState(now.getDate() <= 15 ? 1 : 2);
      
      const [settings, setSettings] = useState(() => {
        try {
          const raw = localStorage.getItem('pst_settings');
          return raw ? JSON.parse(raw) : DEFAULT_SETTINGS;
        } catch { return DEFAULT_SETTINGS; }
      });

      const [currentPeriod, setCurrentPeriod] = useState(() => {
        const [y, m] = defaultMonthStr.split('-').map(Number);
        return generatePeriodInfo(y, m, now.getDate() <= 15 ? 1 : 2);
      });

      const [days, setDays] = useState(() => generateInitialDays(currentPeriod));
      const [records, setRecords] = useState(() => {
        try {
          const raw = localStorage.getItem('pst_records');
          return raw ? JSON.parse(raw) : [];
        } catch { return []; }
      });
      const [currentTab, setCurrentTab] = useState('calc');
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      const calculation = useMemo(() => {
        return calculatePayroll(currentPeriod, days, settings, []);
      }, [currentPeriod, days, settings]);

      const handleGenerateDays = () => {
        const [y, m] = selectedMonth.split('-').map(Number);
        const p = generatePeriodInfo(y, m, selectedHalf);
        setCurrentPeriod(p);
        setDays(generateInitialDays(p));
        showToast(`🗓️ สร้างตารางงวด ${p.label} แล้ว`);
      };

      const handleQuickPreset = (preset) => {
        setDays(prev => prev.map(d => {
          if (preset === 'all_work') return { ...d, type: 'work' };
          if (preset === 'sun_holiday' && d.dow === 0) return { ...d, type: 'holiday', unpaidHours: 0 };
          if (preset === 'sat_sun_holiday' && (d.dow === 0 || d.dow === 6)) return { ...d, type: 'holiday', unpaidHours: 0 };
          return d;
        }));
        showToast('⚡ ปรับสถานะวันเรียบร้อย');
      };

      const handleSaveRecord = () => {
        const filtered = records.filter(r => r.key !== calculation.key);
        const updated = [calculation, ...filtered];
        setRecords(updated);
        localStorage.setItem('pst_records', JSON.stringify(updated));
        showToast(`💾 บันทึกงวด ${calculation.period.label} เรียบร้อยแล้ว`);
      };

      // เป้าหมายรายได้
      const goal = settings.incomeGoal || 0;
      const pct = goal > 0 ? Math.round((calculation.net / goal) * 1000) / 10 : 0;
      const progressWidth = goal > 0 ? Math.min(100, Math.max(0, (calculation.net / goal) * 100)) : 0;
      const isReached = goal > 0 && calculation.net >= goal;

      return (
        <div className={`min-h-screen ${isDark ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs font-semibold shadow-2xl">
              {toast}
            </div>
          )}

          {/* Header */}
          <header className={`border-b sticky top-0 z-40 backdrop-blur-md ${isDark ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-2xl">💰</span>
                <div>
                  <h1 className="font-bold text-sm sm:text-base leading-tight">PaySlip Tracker</h1>
                  <p className="text-[10px] text-slate-400">คำนวณค่าแรงรายวันและสลิปเงินเดือน</p>
                </div>
              </div>

              <button onClick={() => setIsDark(!isDark)} className={`p-2 rounded-xl border text-xs ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-300'}`}>
                {isDark ? '☀️ โหมดสว่าง' : '🌙 โหมดมืด'}
              </button>
            </div>

            <div className="max-w-5xl mx-auto px-4 flex gap-2 border-t border-slate-800/40 py-2">
              <button onClick={() => setCurrentTab('calc')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTab === 'calc' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                🧮 คำนวณงวดใหม่
              </button>
              <button onClick={() => setCurrentTab('hist')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTab === 'hist' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                📚 ประวัติ ({records.length})
              </button>
              <button onClick={() => setCurrentTab('set')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTab === 'set' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                ⚙️ ตั้งค่า
              </button>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-4 space-y-5">
            {currentTab === 'calc' && (
              <>
                {/* งวดคำนวณ */}
                <div className={`p-4 rounded-2xl border ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                  <h2 className="text-sm font-bold mb-3">1. เลือกงวดจ่ายค่าแรง</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">เดือน / ปี (ค.ศ.)</label>
                      <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-300'}`} />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">งวดการคำนวณ</label>
                      <select value={selectedHalf} onChange={e => setSelectedHalf(Number(e.target.value))} className={`w-full px-3 py-2 rounded-xl border text-xs ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-300'}`}>
                        <option value={1}>งวดแรก (1–15) → จ่ายวันที่ 20</option>
                        <option value={2}>งวดหลัง (16–สิ้นเดือน) → จ่ายวันที่ 5</option>
                      </select>
                    </div>
                    <button onClick={handleGenerateDays} className="py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold">
                      สร้างตารางวัน 🗓️
                    </button>
                  </div>
                </div>

                {/* ตารางวันทำงาน */}
                <div className={`p-4 rounded-2xl border ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                    <h2 className="text-sm font-bold">2. บันทึกวันทำงาน ({calculation.period.label})</h2>
                    <div className="flex gap-1 text-xs">
                      <button onClick={() => handleQuickPreset('all_work')} className="px-2 py-1 rounded bg-slate-700/50 hover:bg-slate-700">ทั้งหมด=ทำงาน</button>
                      <button onClick={() => handleQuickPreset('sun_holiday')} className="px-2 py-1 rounded bg-slate-700/50 hover:bg-slate-700">อาทิตย์=หยุด</button>
                      <button onClick={() => handleQuickPreset('sat_sun_holiday')} className="px-2 py-1 rounded bg-slate-700/50 hover:bg-slate-700">เสาร์-อาทิตย์=หยุด</button>
                    </div>
                  </div>

                  <div className={`p-3 rounded-xl border mb-3 text-xs ${isDark ? 'bg-amber-950/20 border-amber-800/50 text-amber-300' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>
                    <strong>เงื่อนไขการคำนวณ:</strong> วันหยุดประจำสัปดาห์ = <span className="underline font-bold">ไม่ได้ค่าแรง (0 หน่วยวัน / 0.00 ฿)</span> · วันนักขัตฤกษ์ = <span className="underline font-bold text-emerald-400">ได้ค่าแรงแต่ไม่นำมาคิดประกันสังคม</span>
                  </div>

                  <div className="space-y-2">
                    {days.map((day, idx) => (
                      <div key={day.d} className={`p-2.5 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs ${day.type === 'holiday' ? 'opacity-60 bg-slate-900/40' : ''} ${isDark ? 'border-slate-700/60 bg-slate-900/60' : 'border-slate-200 bg-white'}`}>
                        <div className="flex items-center gap-2">
                          <span className="w-8 font-bold text-blue-400">วันที่ {day.d}</span>
                          <span className={`px-1.5 py-0.5 rounded text-[10px] ${day.dow === 0 || day.dow === 6 ? 'bg-rose-500/10 text-rose-400' : 'text-slate-400'}`}>{TH_DAYS[day.dow]}</span>
                        </div>

                        <div className="flex-1 flex items-center gap-2">
                          <select 
                            value={day.type} 
                            onChange={e => {
                              const next = [...days];
                              next[idx] = { ...next[idx], type: e.target.value };
                              setDays(next);
                            }}
                            className={`px-2 py-1 rounded-lg border text-xs ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-300'}`}
                          >
                            {Object.entries(DAY_TYPES).map(([k, v]) => (
                              <option key={k} value={k}>{v.label}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          {day.type === 'holiday' && <span className="text-[11px] text-slate-400 font-semibold px-2 py-0.5 rounded bg-slate-800">🏖️ หยุดสัปดาห์ (0 หน่วยวัน)</span>}
                          {day.type === 'work' && <span className="text-[11px] text-emerald-400 font-semibold px-2 py-0.5 rounded bg-emerald-500/10">✅ ได้เต็ม ({formatMoney(settings.rate)} ฿)</span>}
                          {day.type === 'pubwork' && <span className="text-[11px] text-amber-400 font-semibold px-2 py-0.5 rounded bg-amber-500/10">🎌 {settings.holMult}x ({formatMoney(settings.rate * settings.holMult)} ฿ - ไม่คิด ปกส.)</span>}
                          {day.type === 'puboff' && <span className="text-[11px] text-amber-300 font-semibold px-2 py-0.5 rounded bg-amber-500/10">🎏 หยุดขัตฤกษ์ ({formatMoney(settings.rate)} ฿ - ไม่คิด ปกส.)</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* สลิปสรุปผล */}
                <div className={`p-5 rounded-2xl border ${isDark ? 'bg-slate-800/90 border-slate-700' : 'bg-white border-slate-200'}`}>
                  <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-700/50">
                    <div>
                      <h2 className="text-base font-bold">รายการเงินสลิป</h2>
                      <p className="text-xs text-slate-400">งวด {calculation.period.label} · วันจ่าย: {calculation.period.payLabel}</p>
                    </div>
                    <div className="flex gap-2 no-print">
                      <button onClick={handleSaveRecord} className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold">
                        💾 บันทึกงวดนี้
                      </button>
                    </div>
                  </div>

                  {/* แถบเป้าหมายรายได้ */}
                  {goal > 0 && (
                    <div className={`p-3.5 rounded-xl border mb-4 ${isReached ? 'bg-emerald-950/20 border-emerald-800/40' : 'bg-slate-900/60 border-slate-700'}`}>
                      <div className="flex justify-between text-xs mb-1.5">
                        <span>🎯 <strong>เป้าหมายรายได้ต่อเดือน:</strong> {formatMoney(goal)} ฿</span>
                        <span className="font-bold font-mono text-emerald-400">{pct}%</span>
                      </div>
                      <div className="w-full h-2.5 rounded-full bg-slate-950 overflow-hidden">
                        <div className={`h-full rounded-full transition-all duration-500 ${isReached ? 'bg-emerald-400' : 'bg-blue-500'}`} style={{ width: `${progressWidth}%` }}></div>
                      </div>
                    </div>
                  )}

                  {/* ตารางสลิป 2 ฝั่ง */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    {/* รายได้ */}
                    <div className="rounded-xl border border-slate-700/60 overflow-hidden">
                      <div className="p-2.5 font-bold flex justify-between bg-slate-900 text-emerald-400 border-b border-slate-800">
                        <span>รายการรายได้</span>
                        <span>จำนวนเงิน</span>
                      </div>
                      <div className="p-2 space-y-2">
                        <div className="flex justify-between">
                          <div>
                            <span className="font-semibold">ค่าแรงรายวัน</span>
                            <div className="text-[10px] text-slate-400">({calculation.stats.ssoWageUnits} วัน × {formatMoney(settings.rate)} ฿)</div>
                          </div>
                          <span className="font-mono font-bold">{formatMoney(calculation.dailyWage)}</span>
                        </div>

                        {calculation.holidayWorkPay > 0 && (
                          <div className="flex justify-between text-amber-300">
                            <div>
                              <span>ค่าทำงานในวันหยุด 1เท่า</span>
                              <div className="text-[10px] text-slate-400">(ไม่นำมาคิดประกันสังคม)</div>
                            </div>
                            <span className="font-mono font-bold">{formatMoney(calculation.holidayWorkPay)}</span>
                          </div>
                        )}

                        {calculation.pubHolidayPay > 0 && (
                          <div className="flex justify-between text-amber-200">
                            <div>
                              <span>ค่าแรงทำงานในวันหยุดประเพณี</span>
                              <div className="text-[10px] text-slate-400">(ไม่นำมาคิดประกันสังคม)</div>
                            </div>
                            <span className="font-mono font-bold">{formatMoney(calculation.pubHolidayPay)}</span>
                          </div>
                        )}

                        <div className="pt-2 border-t border-slate-800 flex justify-between font-bold text-sm text-emerald-400">
                          <span>รวมรายได้</span>
                          <span className="font-mono">{formatMoney(calculation.gross)}</span>
                        </div>
                      </div>
                    </div>

                    {/* รายการหัก */}
                    <div className="rounded-xl border border-slate-700/60 overflow-hidden">
                      <div className="p-2.5 font-bold flex justify-between bg-slate-900 text-rose-400 border-b border-slate-800">
                        <span>รายการหัก</span>
                        <span>จำนวนเงิน</span>
                      </div>
                      <div className="p-2 space-y-2">
                        <div className="flex justify-between">
                          <div>
                            <span className="font-semibold">ประกันสังคม ({settings.sso}%)</span>
                            <div className="text-[10px] text-slate-400">คิดจากค่าแรงรายวัน: {formatMoney(calculation.ssoBaseAmount)} ฿</div>
                          </div>
                          <span className="font-mono font-bold text-rose-400">-{formatMoney(calculation.sso)}</span>
                        </div>

                        <div className="flex justify-between text-slate-400">
                          <span>ภาษี</span>
                          <span className="font-mono">0.00</span>
                        </div>

                        <div className="pt-2 border-t border-slate-800 flex justify-between font-bold text-sm text-rose-400">
                          <span>รวมเงินหัก</span>
                          <span className="font-mono">-{formatMoney(calculation.ded)}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* เงินสุทธิ */}
                  <div className="mt-4 p-4 rounded-xl border border-emerald-800/40 bg-emerald-950/30 flex justify-between items-center">
                    <div>
                      <span className="text-xs text-emerald-400 font-bold block">เงินสุทธิ</span>
                      <span className="text-[11px] text-slate-400">ยอดเงินรับจริง</span>
                    </div>
                    <div className="text-2xl font-bold font-mono text-emerald-400">
                      {formatMoney(calculation.net)} ฿
                    </div>
                  </div>
                </div>
              </>
            )}

            {currentTab === 'hist' && (
              <div className={`p-4 rounded-2xl border ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                <h2 className="text-sm font-bold mb-3">ประวัติการบันทึก ({records.length} รายการ)</h2>
                {records.length === 0 ? <p className="text-xs text-slate-400">ยังไม่มีข้อมูล</p> : (
                  <div className="space-y-2 text-xs">
                    {records.map(r => (
                      <div key={r.key} className="p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                        <div>
                          <strong>{r.period.label}</strong>
                          <div className="text-[11px] text-slate-400">รายได้: {formatMoney(r.gross)} ฿ · หัก: {formatMoney(r.ded)} ฿</div>
                        </div>
                        <div className="font-mono font-bold text-emerald-400 text-sm">{formatMoney(r.net)} ฿</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {currentTab === 'set' && (
              <div className={`p-4 rounded-2xl border ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                <h2 className="text-sm font-bold mb-3">ตั้งค่าอัตราการคำนวณ</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">ค่าแรงต่อวัน (บาท)</label>
                    <input type="number" value={settings.rate} onChange={e => setSettings({ ...settings, rate: parseFloat(e.target.value) || 0 })} className="w-full p-2 rounded-lg border bg-slate-900 border-slate-700 font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">เป้าหมายรายได้ต่อเดือน (บาท)</label>
                    <input type="number" value={settings.incomeGoal} onChange={e => setSettings({ ...settings, incomeGoal: parseFloat(e.target.value) || 0 })} className="w-full p-2 rounded-lg border bg-slate-900 border-slate-700 font-mono" />
                  </div>
                </div>
                <button onClick={() => { localStorage.setItem('pst_settings', JSON.stringify(settings)); showToast('บันทึกการตั้งค่าแล้ว'); }} className="mt-4 px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold">
                  บันทึก
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
