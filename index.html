<!DOCTYPE html>
<html lang="th" class="dark">
<head>

  <title>PaySlip Tracker v6 — ระบบคำนวณค่าแรงรายวันและสลิปเงินเดือน (Auto Import)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Thai"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }

      }

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const APP_VERSION = 'v6';

    if (window.Chart) {
      Chart.defaults.font.family = '"IBM Plex Sans Thai", sans-serif';
    }

    // ===================== CONSTANTS =====================
    const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const TH_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    const TH_DAYS_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];

    const DAY_TYPES = {
      work: { label: '✅ วันทำงานปกติ', pay: 1 },
      pubwork: { label: '🎌 นักขัตฤกษ์/OT1 มาทำงาน (2 แรง)', pay: 1 },
      puboff: { label: '🎏 นักขัตฤกษ์ (หยุด 1 แรง)', pay: 1 },
      holiday: { label: '🏖️ วันหยุด (0 บาท)', pay: 0 },
      sick: { label: '🤒 ลาป่วย (ได้เงิน)', pay: 1 },
      personal: { label: '📄 ลากิจ (ได้เงิน)', pay: 1 },
      annual: { label: '🌴 ลาพักร้อน', pay: 1 },
      absent: { label: '❌ ขาดงาน (ไม่ได้รับค่าจ้าง)', pay: 0 },
      unpaid: { label: '⛔ ลาไม่รับค่าจ้าง', pay: 0 },
    };

    const DEFAULT_SETTINGS = {
      rate: 412, hours: 8, holMult: 2, sso: 5, ssoCap: 750, ssoBase: 'wage', tax: 0,
      othName: 'หักอื่นๆ', oth: 0, quickName: 'Incentive Audit', quickAmt: 250, incomeGoal: 15000,
    };
    const NUMERIC_KEYS = ['rate', 'hours', 'holMult', 'sso', 'ssoCap', 'tax', 'oth', 'quickAmt', 'incomeGoal'];

    // ===================== HELPERS =====================
    const uid = () => Math.random().toString(36).slice(2, 10);
    const pad = (n) => String(n).padStart(2, '0');
    function formatMoney(val) {
      const n = typeof val === 'number' && !isNaN(val) ? val : Number(val) || 0;
      return n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function shortLabel(p) {
      return `${p.half === 1 ? 'ต้น' : 'ปลาย'} ${TH_MONTHS[p.m - 1]}${String(p.y + 543).slice(-2)}`;
    }
    // งวดแรก 1–15 · งวดหลัง 16–วันสุดท้ายของเดือน (30 หรือ 31 หรือ 28/29)
    function generatePeriodInfo(year, month, half) {
      const lastDay = new Date(year, month, 0).getDate();
      const startDay = half === 1 ? 1 : 16;
      const endDay = half === 1 ? 15 : lastDay;
      const payDateObj = half === 1 ? new Date(year, month - 1, 20) : new Date(year, month, 5);
      const payMonth = payDateObj.getMonth() + 1;
      const payYear = payDateObj.getFullYear();
      return {
        y: year, m: month, half, startDay, endDay,
        key: `${year}-${pad(month)}-H${half}`,
        label: `${startDay}–${endDay} ${TH_MONTHS[month - 1]} ${year + 543}`,
        payDate: `${payYear}-${pad(payMonth)}-${pad(payDateObj.getDate())}`,
        payLabel: `${payDateObj.getDate()} ${TH_MONTHS[payMonth - 1]} ${payYear + 543}`,
      };
    }
    function generateInitialDays(period, offDays = []) {
      const days = [];
      for (let d = period.startDay; d <= period.endDay; d++) {
        const dt = new Date(period.y, period.m - 1, d);
        const dow = dt.getDay();
        days.push({
          d, dow,
          dateStr: `${period.y}-${pad(period.m)}-${pad(d)}`,
          type: offDays.includes(dow) ? 'holiday' : 'work',
          unpaidHours: 0,
        });
      }
      return days;
    }

    // ===================== IMPORT HELPERS =====================
    const median = (arr) => {
      const s = [...arr].sort((a, b) => a - b);
      const n = s.length;
      if (!n) return 0;
      return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
    };
    const spread = (arr) => (arr.length ? Math.max(...arr) - Math.min(...arr) : 0);
    const round4 = (x) => Math.round((Number(x) || 0) * 10000) / 10000;
    function fmtHM(h) {
      const mins = Math.round((Number(h) || 0) * 60);
      return `${Math.floor(mins / 60)}:${pad(mins % 60)}`;
    }
    const hmOrDash = (h) => (h > 0.001 ? fmtHM(h) : '-');

    // ฟอนต์ไทยใน PDF บางตัวใช้รหัส Private Use Area (U+F700–F71A) → แปลงกลับเป็นอักษรไทยปกติ
    const PUA_MAP = {
      '\uF700': '\u0E10', '\uF701': '\u0E34', '\uF702': '\u0E35', '\uF703': '\u0E36', '\uF704': '\u0E37',
      '\uF705': '\u0E48', '\uF706': '\u0E49', '\uF707': '\u0E4A', '\uF708': '\u0E4B', '\uF709': '\u0E4C',
      '\uF70A': '\u0E48', '\uF70B': '\u0E49', '\uF70C': '\u0E4A', '\uF70D': '\u0E4B', '\uF70E': '\u0E4C',
      '\uF70F': '\u0E0D', '\uF710': '\u0E31', '\uF711': '\u0E4D', '\uF712': '\u0E47', '\uF713': '\u0E48',
      '\uF714': '\u0E49', '\uF715': '\u0E4A', '\uF716': '\u0E4B', '\uF717': '\u0E4C', '\uF718': '\u0E38',
      '\uF719': '\u0E39', '\uF71A': '\u0E3A',
    };
    // แก้ "ํา" (นิคหิต + สระอา) ที่ PDF ไทยแยกตัว ให้เป็น "ำ"
    const normTh = (s) => String(s ?? '')
      .replace(/[\uF700-\uF71A]/g, (c) => PUA_MAP[c] || '')
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, '')
      .replace(/\u0E4D\s*([\u0E48-\u0E4B]?)\s*\u0E32/g, '$1\u0E33')
      .normalize('NFC');
    const hdrKey = (s) => normTh(s).toLowerCase().replace(/\s+/g, '');

    const COL_LABELS = {
      date: 'วันที่', timeIn: 'เวลาเข้า', timeOut: 'เวลาออก', shift: 'กะ', type: 'ประเภท',
      work: 'จำนวนทำงาน', late: 'มาสาย', early: 'กลับก่อน', noIn: 'ไม่รูดเข้า', noOut: 'ไม่รูดออก',
      absent: 'ขาดงาน', sick: 'ลาป่วย', personal: 'ลากิจ', annual: 'ลาพักร้อน', otherLeave: 'ลาอื่นๆ',
      ot1: 'OT1', ot15: 'OT1.5', ot2: 'OT2', ot3: 'OT3', otTotal: 'รวม OT',
    };

    function matchHeaderKey(raw) {
      const k = hdrKey(raw);
      if (!k) return null;
      if (k.includes('รวม') && (k.includes('ot') || k.includes('โอที'))) return 'otTotal';
      if (/(ot|โอที)0?1\.5/.test(k)) return 'ot15';
      if (/(ot|โอที)0?1(?![.\d])/.test(k)) return 'ot1';
      if (/(ot|โอที)0?2(?![.\d])/.test(k)) return 'ot2';
      if (/(ot|โอที)0?3(?![.\d])/.test(k)) return 'ot3';
      if (k.includes('รูดบัตร') && k.includes('เข้า')) return 'noIn';
      if (k.includes('รูดบัตร') && k.includes('ออก')) return 'noOut';
      if (k.includes('จำนวนทำงาน') || k.includes('ชั่วโมงทำงาน') || k.includes('รวมเวลาทำงาน')) return 'work';
      if (k.includes('มาสาย') || k === 'late') return 'late';
      if (k.includes('กลับก่อน') || k.includes('ออกก่อน') || k === 'early') return 'early';
      if (k.includes('ขาดงาน') || k === 'absent') return 'absent';
      if (k.includes('ลาป่วย')) return 'sick';
      if (k.includes('ลากิจ')) return 'personal';
      if (k.includes('พักร้อน')) return 'annual';
      if (k.includes('ลาอื่น')) return 'otherLeave';
      if (k.includes('ประเภท') || k === 'type') return 'type';
      if (k.includes('เวลาเข้า') || k === 'timein') return 'timeIn';
      if (k.includes('เวลาออก') || k === 'timeout') return 'timeOut';
      if (k.includes('วันที่') || k === 'date') return 'date';
      if (k.includes('จำนวน')) return 'work';
      if (/(^|\|)กะ/.test(k)) return 'shift';
      return null;
    }

    function fixYear(y, m, d) {
      if (y < 100) y += y >= 40 ? 2500 : 2000;
      if (y > 2400) y -= 543; // พ.ศ. → ค.ศ.
      if (m < 1 || m > 12 || d < 1 || d > 31) return null;
      if (d > new Date(y, m, 0).getDate()) return null;
      return { y, m, d };
    }
    function parseDateStr(s) {
      const str = normTh(s);
      let m = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return fixYear(+m[1], +m[2], +m[3]);
      m = str.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
      if (m) return fixYear(+m[3], +m[2], +m[1]);
      return null;
    }
    function parseDateCell(rawV, textV) {
      if (typeof rawV === 'number' && rawV > 20000 && rawV < 400000 && window.XLSX) {
        const o = XLSX.SSF.parse_date_code(rawV);
        if (o) return fixYear(o.y, o.m, o.d);
      }
      return parseDateStr(textV);
    }
    function hoursFromText(s) {
      const str = normTh(s).trim();
      if (!str || /^[-–—]+$/.test(str)) return 0;
      const m = str.match(/(\d{1,3})\s*:\s*(\d{2})(?!\d)/);
      if (m) return (+m[1]) + (+m[2]) / 60;
      const n = parseFloat(str.replace(/[^\d.]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    // เวลาสแกนเข้า-ออก = ชั่วโมง 2 หลัก เช่น 05:42, 14:00 (ต่างจากจำนวนชั่วโมง เช่น 8:00, 0:02)
    const CLOCK_RE = /(?:^|\s)(?:[01]\d|2[0-3]):[0-5]\d(?=\s|$)/;

    function cellsToRecord(dt, cells, colsSet, rowText) {
      const h = (k) => hoursFromText(cells[k] || '');
      const txt = normTh(rowText || '');
      const timeTxt = `${cells.timeIn || ''} ${cells.timeOut || ''}`.trim();
      const hasTimeCols = colsSet.has('timeIn') || colsSet.has('timeOut');
      const hasTime = hasTimeCols ? /\d{1,2}:\d{2}/.test(timeTxt) : CLOCK_RE.test(txt);
      let typeText = normTh(cells.type || '').trim();
      if (!typeText) {
        const m = txt.replace(/\s+/g, '').match(/วันหยุดนักขัตฤกษ์|นักขัตฤกษ์|วันหยุด|วันทำงาน/);
        typeText = m ? m[0] : '';
      }
      return {
        ...dt,
        typeText,
        timeTxt,
        work: h('work'), late: h('late'), early: h('early'), absent: h('absent'),
        sick: h('sick'), personal: h('personal'), annual: h('annual'), otherLeave: h('otherLeave'),
        ot1: h('ot1'), otTotal: h('otTotal'),
        hasTime,
        cols: [...colsSet],
        rowText: txt,
      };
    }

    // ===== กติกาแปลงข้อมูลไฟล์ลงเวลา → ประเภทวันในเว็บ =====
    function classifyRow(r, stdHours = 8) {
      const t = normTh(r.typeText || '').replace(/\s+/g, '');
      const isPub = /นักขัต|ขัตฤกษ์|ประเพณี/.test(t);
      const isOff = !isPub && t.includes('หยุด');
      const work = r.work || 0;
      const hasWork = work >= 0.01;
      const cols = new Set(r.cols || []);
      const otVal = Math.max(r.ot1 || 0, r.otTotal || 0);
      // OT1 กับ รวม OT ต้องมีค่าคู่กัน (ถ้าไฟล์มีทั้ง 2 คอลัมน์)
      const otValid = (cols.has('ot1') && cols.has('otTotal')) ? (r.ot1 > 0 && r.otTotal > 0) : otVal > 0;
      const lateEarly = (r.late || 0) + (r.early || 0);
      const otWarn = otVal > 0 && !otValid ? 'มีค่า OT แค่ช่องเดียว โปรดตรวจสอบ' : '';

      // 1) วันหยุดนักขัตฤกษ์
      if (isPub) {
        if (r.hasTime || hasWork || otValid) {
          return { type: 'pubwork', unpaidHours: round4(Math.min(lateEarly, stdHours)), note: `นักขัตฤกษ์ มาทำงาน${otValid ? ` (OT1 ${fmtHM(otVal)})` : ''} → 2 แรง`, warn: '' };
        }
        return { type: 'puboff', unpaidHours: 0, note: 'นักขัตฤกษ์ ไม่ได้มาทำงาน → 1 แรง', warn: otWarn };
      }
      // 2) มี 8:00 ใน OT1 และ รวม OT (ไม่มีชั่วโมงทำงานปกติ) → 2 แรง
      if (otValid && !hasWork) {
        return { type: 'pubwork', unpaidHours: 0, note: `OT1 / รวม OT ${fmtHM(otVal)} → 2 แรง`, warn: r.hasTime ? '' : 'ไม่มีเวลาสแกนเข้า-ออก โปรดตรวจสอบ' };
      }
      // 3) ลาต่างๆ
      if (r.sick > 0) return { type: 'sick', unpaidHours: 0, note: `ลาป่วย ${fmtHM(r.sick)}`, warn: '' };
      if (r.personal > 0) return { type: 'personal', unpaidHours: 0, note: `ลากิจ ${fmtHM(r.personal)}`, warn: '' };
      if (r.annual > 0) return { type: 'annual', unpaidHours: 0, note: `ลาพักร้อน ${fmtHM(r.annual)}`, warn: '' };
      if (r.otherLeave > 0) return { type: 'personal', unpaidHours: 0, note: `ลาอื่นๆ ${fmtHM(r.otherLeave)} (คิดเป็นลากิจ)`, warn: '' };
      // 4) ประเภท = วันหยุด และจำนวนทำงานไม่มี 8:00 → 0 บาท
      if (isOff && !hasWork) return { type: 'holiday', unpaidHours: 0, note: 'วันหยุด ไม่มีชั่วโมงทำงาน → 0 บาท', warn: otWarn };
      // 5) จำนวนทำงานมีชั่วโมง (เช่น 8:00) → วันทำงาน
      if (hasWork) {
        let unpaid = lateEarly + (r.absent || 0);
        if (unpaid < 0.001 && work < stdHours - 0.01) unpaid = stdHours - work;
        unpaid = Math.min(unpaid, stdHours);
        let note = isOff ? `วันหยุดแต่มาทำงาน ${fmtHM(work)} → 1 แรง` : (unpaid > 0.001 ? `ทำงาน ${fmtHM(work)} · หัก ${fmtHM(unpaid)}` : `ทำงาน ${fmtHM(work)} → 1 แรง`);
        if (r.ot1 > 0) note += ` · OT1 ${fmtHM(r.ot1)} (ยังไม่คิดเงิน OT)`;
        return { type: 'work', unpaidHours: round4(unpaid), note, warn: '' };
      }
      // 6) มีเวลาสแกนเข้า-ออก แต่อ่านช่องจำนวนทำงานไม่ได้ → ถือเป็นวันทำงาน
      if (r.hasTime) {
        return { type: 'work', unpaidHours: round4(Math.min(lateEarly, stdHours)), note: 'มีเวลาสแกนเข้า-ออก → วันทำงาน', warn: 'อ่านช่องจำนวนทำงานไม่ได้' };
      }
      // 7) ไม่มีชั่วโมงทำงาน / ลา / OT / เวลาสแกน → ขาดงาน
      return { type: 'absent', unpaidHours: 0, note: r.absent > 0 ? `ขาดงาน ${fmtHM(r.absent)}` : 'ไม่มีชั่วโมงทำงาน → ขาดงาน', warn: r.absent > 0 ? '' : (otWarn || 'ไม่พบชั่วโมงทำงาน/ลา/OT') };
    }

    // ===== อ่าน Excel / CSV =====
    function parseExcelFile(wb) {
      for (const name of wb.SheetNames) {
        const sheet = wb.Sheets[name];
        const txt = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
        let hIdx = -1, cols = {};
        for (let i = 0; i < Math.min(40, txt.length); i++) {
          const c = {};
          (txt[i] || []).forEach((h, j) => { const k = matchHeaderKey(h); if (k && c[k] == null) c[k] = j; });
          if (Object.keys(c).length >= 3) { hIdx = i; cols = c; break; }
        }
        if (hIdx < 0) continue;

        const dc0 = cols.date != null ? cols.date : 0;
        let start = hIdx + 1;
        if (!parseDateCell((raw[hIdx + 1] || [])[dc0], (txt[hIdx + 1] || [])[dc0])) {
          (txt[hIdx + 1] || []).forEach((h, j) => {
            if (!String(h).trim()) return;
            const k = matchHeaderKey(`${(txt[hIdx] || [])[j] || ''} ${h}`) || matchHeaderKey(h);
            if (k && cols[k] == null) cols[k] = j;
          });
          start = hIdx + 2;
        }

        const dc = cols.date != null ? cols.date : 0;
        const colsSet = new Set(Object.keys(cols));
        const rows = {};
        for (let i = start; i < txt.length; i++) {
          const tr = txt[i] || [], rr = raw[i] || [];
          const dt = parseDateCell(rr[dc], tr[dc]);
          if (!dt) continue;
          const cells = {};
          Object.entries(cols).forEach(([k, j]) => {
            const t = String(tr[j] ?? '').trim();
            const v = rr[j];
            cells[k] = (typeof v === 'number' && v > 0 && v < 1 && !/:\d{2}/.test(t)) ? fmtHM(v * 24) : t;
          });
          rows[`${dt.y}-${dt.m}-${dt.d}`] = cellsToRecord(dt, cells, colsSet, tr.map(String).join(' '));
        }
        const list = Object.values(rows);
        if (list.length) {
          return { rows: list, info: `ชีต "${name}" · พบคอลัมน์: ${Object.keys(cols).map(k => COL_LABELS[k]).join(', ')}` };
        }
      }
      return { rows: [], info: 'ไม่พบหัวตาราง (วันที่ / ประเภท / จำนวนทำงาน) ในไฟล์' };
    }

    // ===== อ่าน PDF (จับคอลัมน์ตามตำแหน่งหัวตาราง) =====
    const DATE_RE = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s*\(?[\u0E00-\u0E7F.]{1,10}\)?)?$/;
    const HDR_FRAG = /วันที่|เวลา|เข้า|ออก|กะ|ประเภท|จำนวน|ทำงาน|สาย|กลับ|ก่อน|รูด|บัตร|ขาด|ลา|ป่วย|กิจ|พัก|ร้อน|อื่น|รวม|^ot|ot\d|โอที|ชม|นาที|ครั้ง|^\(|^date$|^type$/;

    // รวมข้อความหัวตารางที่ซ้อนกันในคอลัมน์เดียว (เช่น "จำนวนทำงาน" + "(ชม:นาที)")
    function buildHeaderCols(arr, R, C) {
      const iv = arr.map(it => ({ it, lo: C(it) - it.w / 2, hi: C(it) + it.w / 2 })).sort((a, b) => a.lo - b.lo);
      const clusters = [];
      iv.forEach(v => {
        const last = clusters[clusters.length - 1];
        if (last && v.lo <= last.hi - 0.5) {
          last.items.push(v.it);
          last.hi = Math.max(last.hi, v.hi);
        } else {
          clusters.push({ items: [v.it], lo: v.lo, hi: v.hi });
        }
      });
      const cols = clusters.map(cl => {
        const asc = [...cl.items].sort((a, b) => R(a) - R(b)).map(i => i.str).join('');
        const desc = [...cl.items].sort((a, b) => R(b) - R(a)).map(i => i.str).join('');
        return { key: matchHeaderKey(asc + '|' + desc), c: (cl.lo + cl.hi) / 2 };
      });
      const seen = new Set();
      cols.forEach(c => { if (c.key) { if (seen.has(c.key)) c.key = null; else seen.add(c.key); } });
      return { cols, matched: seen.size };
    }

    async function parsePdfFile(file) {
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const byDate = {};
      const found = new Set();
      let lastHeader = null;

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        const items = [];
        tc.items.forEach(it => {
          const rawStr = normTh(it.str || '');
          const str = rawStr.trim();
          if (!str) return;
          const a = it.transform[0], b = it.transform[1];
          const n = Math.hypot(a, b) || 1;
          const dx = a / n, dy = b / n, w = it.width || 0;
          const x0 = it.transform[4], y0 = it.transform[5];
          const tokens = str.split(/\s+/);
          // ถ้าข้อความหลายช่องถูกรวมเป็นก้อนเดียว (เช่น "13:48 23:21") → แยกตามตำแหน่งโดยประมาณ
          if (tokens.length > 1 && tokens.filter(t => /^\d{1,2}:\d{2}$/.test(t)).length >= 2) {
            let idx = 0;
            tokens.forEach(t => {
              const pos = rawStr.indexOf(t, idx);
              idx = pos + t.length;
              const mid = ((pos + t.length / 2) / rawStr.length) * w;
              items.push({ str: t, cx: x0 + dx * mid, cy: y0 + dy * mid, dx, dy, w: (t.length / rawStr.length) * w });
            });
          } else {
            items.push({ str, cx: x0 + dx * w / 2, cy: y0 + dy * w / 2, dx, dy, w });
          }
        });

        let dates = items.filter(it => DATE_RE.test(it.str));
        if (!dates.length) continue;

        // ตรวจทิศทางหน้า (แนวตั้ง / หมุนแนวนอน)
        const transposed = dates.length >= 2
          ? spread(dates.map(d => d.cx)) > spread(dates.map(d => d.cy))
          : Math.abs(dates[0].dy) > Math.abs(dates[0].dx);
        const R = it => (transposed ? it.cx : it.cy); // แกนแถว
        const C = it => (transposed ? it.cy : it.cx); // แกนคอลัมน์

        const dateC = median(dates.map(C));
        dates = dates.filter(d => Math.abs(C(d) - dateC) < 25).sort((a, b) => R(a) - R(b));
        dates = dates.filter((d, i) => i === 0 || R(d) - R(dates[i - 1]) > 2);
        const gaps = dates.slice(1).map((d, i) => R(d) - R(dates[i]));
        const rowGap = gaps.length ? median(gaps) : 14;

        // ใช้เฉพาะกลุ่มวันที่ที่เรียงติดกันยาวที่สุด (ตัดวันที่หัวรายงาน/ท้ายหน้า)
        let run = [dates[0]], best = run;
        for (let i = 1; i < dates.length; i++) {
          if (R(dates[i]) - R(dates[i - 1]) <= rowGap * 2.5) run.push(dates[i]);
          else run = [dates[i]];
          if (run.length > best.length) best = run;
        }
        dates = best;

        const dateSet = new Set(dates);
        const tol = Math.max(3, rowGap * 0.55);
        const rowOf = (it) => {
          let bestD = null, bd = Infinity;
          for (const d of dates) { const dd = Math.abs(R(d) - R(it)); if (dd < bd) { bd = dd; bestD = d; } }
          return bd <= tol ? bestD : null;
        };

        const others = items.filter(it => !dateSet.has(it) && !DATE_RE.test(it.str));
        const rMin = R(dates[0]), rMax = R(dates[dates.length - 1]);
        const band = Math.max(60, rowGap * 5);
        const hdrCand = (side) => others.filter(it => {
          if (rowOf(it) || it.str.length > 24 || !HDR_FRAG.test(hdrKey(it.str))) return false;
          return side < 0 ? (R(it) < rMin && rMin - R(it) <= band) : (R(it) > rMax && R(it) - rMax <= band);
        });
        const sides = [buildHeaderCols(hdrCand(-1), R, C), buildHeaderCols(hdrCand(1), R, C)].sort((a, b) => b.matched - a.matched);

        let header = sides[0];
        if (header.matched >= 3) lastHeader = header;
        else header = lastHeader || { cols: [], matched: 0 };

        const colList = header.cols.filter(c => c.key !== 'date').concat([{ key: 'date', c: dateC }]);
        const colsSet = new Set(colList.filter(c => c.key && c.key !== 'date').map(c => c.key));
        colsSet.forEach(k => found.add(k));

        const rowData = new Map();
        const rowItems = new Map();
        dates.forEach(d => { rowData.set(d, {}); rowItems.set(d, []); });
        others.forEach(it => {
          const d = rowOf(it);
          if (!d) return;
          rowItems.get(d).push(it);
          let bestCol = null, bd = Infinity;
          colList.forEach(col => { const dd = Math.abs(col.c - C(it)); if (dd < bd) { bd = dd; bestCol = col; } });
          if (!bestCol || !bestCol.key || bestCol.key === 'date' || bd > 60) return;
          const cells = rowData.get(d);
          cells[bestCol.key] = cells[bestCol.key] ? `${cells[bestCol.key]} ${it.str}` : it.str;
        });

        dates.forEach(d => {
          const m = d.str.match(DATE_RE);
          const dt = fixYear(+m[3], +m[2], +m[1]);
          if (!dt) return;
          const cells = rowData.get(d);
          const rowText = rowItems.get(d).sort((a, b) => C(a) - C(b)).map(i => i.str).join(' ');
          const k = `${dt.y}-${dt.m}-${dt.d}`;
          const filled = Object.keys(cells).length;
          if (!byDate[k] || filled >= byDate[k]._filled) byDate[k] = { ...cellsToRecord(dt, cells, colsSet, rowText), _filled: filled };
        });
      }

      const rows = Object.values(byDate);
      const info = rows.length
        ? `PDF ${pdf.numPages} หน้า · พบคอลัมน์: ${found.size ? [...found].map(k => COL_LABELS[k]).join(', ') : 'ไม่พบหัวตาราง (ใช้เวลาสแกน/ประเภทแทน)'}`
        : 'อ่าน PDF ได้แต่ไม่พบวันที่ — ลองใช้ไฟล์ Excel แทน';
      return { rows, info };
    }

    // ===================== CALCULATION =====================
    function calculatePayroll(period, days, settings, extras) {
      let work = 0, pubW = 0, pubO = 0, holiday = 0, sick = 0, personal = 0, annual = 0, absent = 0, unpaid = 0;
      let unHr = 0, ssoUnHr = 0, pubUnHr = 0, wageUnits = 0, ssoWageUnits = 0;

      days.forEach((day) => {
        const dHr = Math.max(0, Number(day.unpaidHours) || 0);
        switch (day.type) {
          case 'work': work++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'pubwork': pubW++; wageUnits += settings.holMult; pubUnHr += dHr; unHr += dHr; break;
          case 'puboff': pubO++; wageUnits += 1; pubUnHr += dHr; unHr += dHr; break;
          case 'holiday': holiday++; break;
          case 'sick': sick++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'personal': personal++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'annual': annual++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'absent': absent++; break;
          case 'unpaid': unpaid++; break;
        }
      });

      const hourRate = settings.rate / (settings.hours || 8);
      const ssoUnpaidCut = Number((ssoUnHr * hourRate).toFixed(2));
      const pubUnpaidCut = Number((pubUnHr * hourRate).toFixed(2));
      const unpaidCut = Number((unHr * hourRate).toFixed(2));

      const dailyWage = Math.max(0, Number((ssoWageUnits * settings.rate - ssoUnpaidCut).toFixed(2)));
      const holidayWorkPay = Number((pubW * Math.max(0, settings.holMult - 1) * settings.rate).toFixed(2));
      const pubHolidayPay = Math.max(0, Number(((pubW + pubO) * settings.rate - pubUnpaidCut).toFixed(2)));

      const wage = Math.max(0, Number((dailyWage + holidayWorkPay + pubHolidayPay).toFixed(2)));

      const validExtras = (extras || [])
        .filter(e => Number(e.amt) > 0)
        .map(e => ({ name: (e.name || '').trim() || 'รายได้เพิ่มเติม', amt: Number(Number(e.amt).toFixed(2)) }));
      const extraSum = Number(validExtras.reduce((s, i) => s + i.amt, 0).toFixed(2));
      const gross = Number((wage + extraSum).toFixed(2));

      const ssoBaseAmount = settings.ssoBase === 'all' ? Number((dailyWage + extraSum).toFixed(2)) : dailyWage;
      let sso = Math.round(ssoBaseAmount * ((settings.sso || 0) / 100));
      if (settings.ssoCap > 0) sso = Math.min(sso, settings.ssoCap);

      const tax = Number((settings.tax || 0).toFixed(2));
      const oth = Number((settings.oth || 0).toFixed(2));
      const ded = Number((sso + tax + oth).toFixed(2));
      const net = Number((gross - ded).toFixed(2));

      return {
        key: period.key, period, settings, days,
        extras: validExtras, extraSum,
        stats: { work, pubW, pubO, holiday, sick, personal, annual, absent, unpaid,
          paidDays: work + pubW + pubO + sick + personal + annual, unpaidHours: Math.round(unHr * 100) / 100, wageUnits, ssoWageUnits },
        wage, dailyWage, holidayWorkPay, pubHolidayPay, pubWage: holidayWorkPay + pubHolidayPay,
        unpaidCut, gross, sso, ssoBaseAmount, tax, oth, othName: settings.othName || 'หักอื่นๆ', ded, net,
        savedAt: new Date().toISOString(),
      };
    }

    function SectionHead({ num, title, pill, desc, icon }) {
      return (
        <div className="mb-4">
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">

    function Pill({ children, color = 'slate' }) {
      const map = {
        slate: 'bg-slate-100 text-slate-500 dark:bg-slate-700/50 dark:text-slate-400',
        green: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400',
        blue: 'bg-blue-500/10 text-blue-600 dark:text-blue-400',
        purple: 'bg-violet-500/10 text-violet-600 dark:text-violet-400',
      };
      return <span className={`px-3 py-1 rounded-full text-xs sm:text-sm font-semibold whitespace-nowrap ${map[color]}`}>{children}</span>;
    }

    // ===================== CHART WRAPPER =====================
    function ChartBox({ type, data, options, height = 280, deps = [] }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!window.Chart || !canvasRef.current) return;
        chartRef.current = new Chart(canvasRef.current.getContext('2d'), { type, data, options });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [type, JSON.stringify(data), ...deps]);
      return <div className="relative" style={{ height }}><canvas ref={canvasRef}></canvas></div>;
    }

    function themeColors(isDark) {
      return {
        tick: isDark ? '#94a3b8' : '#475569',
        grid: isDark ? 'rgba(148,163,184,0.12)' : 'rgba(100,116,139,0.15)',
        cardBg: isDark ? '#1e293b' : '#ffffff',
        legend: isDark ? '#cbd5e1' : '#334155',
      };
    }

              }} />
          )}
          {list.some(r => r._preview) && <p className="text-[11px] text-slate-400 mt-2">* งวดปัจจุบันที่ยังไม่ได้บันทึก (แสดงตัวอย่าง)</p>}
        </div>
      );
    }

    // ===================== APP =====================
    function App() {
      const [isDark, setIsDark] = useState(() => localStorage.getItem('pst_theme') !== 'light');
      const now = new Date();
      const defaultMonthStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
      const defaultHalf = now.getDate() <= 15 ? 1 : 2;

      const [selectedMonth, setSelectedMonth] = useState(defaultMonthStr);
      const [selectedHalf, setSelectedHalf] = useState(defaultHalf);

      const [settings, setSettings] = useState(() => {
        try {
          const raw = localStorage.getItem('pst_settings');
          return raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : DEFAULT_SETTINGS;
        } catch { return DEFAULT_SETTINGS; }
      });
      const toDraft = (s) => Object.fromEntries(Object.entries(s).map(([k, v]) => [k, String(v)]));
      const [draft, setDraft] = useState(() => toDraft(settings));
      useEffect(() => setDraft(toDraft(settings)), [settings]);

      const [currentPeriod, setCurrentPeriod] = useState(() => {
        const [y, m] = defaultMonthStr.split('-').map(Number);
        return generatePeriodInfo(y, m, defaultHalf);
      });

      const [weeklyOff, setWeeklyOff] = useState(() => {
        try {
          const raw = localStorage.getItem('pst_weekly_off');
          return raw ? JSON.parse(raw) : [];
        } catch { return []; }
      });

      const [days, setDays] = useState(() => generateInitialDays(currentPeriod, weeklyOff));
      const [extras, setExtras] = useState([]);
      const [records, setRecords] = useState(() => {
        try {
          const raw = localStorage.getItem('pst_records');
          return raw ? JSON.parse(raw) : [];
        } catch { return []; }
      });
      const [currentTab, setCurrentTab] = useState('calc');
      const [toast, setToast] = useState(null);
      const [flash, setFlash] = useState(false);
      const slipRef = useRef(null);
      const fileRef = useRef(null);
      const timeFileRef = useRef(null);
      const [importLog, setImportLog] = useState('');
      const [importPreview, setImportPreview] = useState([]);
      const [importing, setImporting] = useState(false);
      const [showRaw, setShowRaw] = useState(false);

      const [cmpA, setCmpA] = useState('');
      const [cmpB, setCmpB] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        clearTimeout(window.__toastT);
        window.__toastT = setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        localStorage.setItem('pst_theme', isDark ? 'dark' : 'light');
      }, [isDark]);

      const persistRecords = (list) => {
        const sorted = [...list].sort((a, b) => b.key.localeCompare(a.key));
        setRecords(sorted);
        localStorage.setItem('pst_records', JSON.stringify(sorted));
      };

      const calculation = useMemo(
        () => calculatePayroll(currentPeriod, days, settings, extras),
        [currentPeriod, days, settings, extras]
      );

      const trendList = useMemo(() => {
        const map = {};
        records.forEach(r => { map[r.key] = r; });
        if (!map[calculation.key]) map[calculation.key] = { ...calculation, _preview: true };
        return Object.values(map).sort((a, b) => a.key.localeCompare(b.key)).slice(-12);
      }, [records, calculation]);

      const handleGenerateDays = () => {
        const [y, m] = selectedMonth.split('-').map(Number);
        const p = generatePeriodInfo(y, m, selectedHalf);
        setCurrentPeriod(p);
        setImportLog('');
        setImportPreview([]);
        const existing = records.find(r => r.key === p.key);
        if (existing) {
          setDays(existing.days);
          setExtras((existing.extras || []).map(e => ({ id: uid(), name: e.name, amt: String(e.amt) })));
          showToast(`📂 โหลดข้อมูลงวด ${p.label} ที่บันทึกไว้แล้ว`);
        } else {
          setDays(generateInitialDays(p, weeklyOff));
          setExtras([]);
          showToast(`🗓️ สร้างตารางงวด ${p.label} แล้ว`);
        }
      };

      const toggleWeeklyOff = (dow) => {
        const isOff = weeklyOff.includes(dow);
        const next = isOff ? weeklyOff.filter(x => x !== dow) : [...weeklyOff, dow];
        setWeeklyOff(next);
        localStorage.setItem('pst_weekly_off', JSON.stringify(next));
        setDays(prev => prev.map(d => {
          if (d.dow !== dow) return d;
          if (!isOff && d.type === 'work') return { ...d, type: 'holiday', unpaidHours: 0 };
          if (isOff && d.type === 'holiday') return { ...d, type: 'work' };
          return d;
        }));
        showToast(`${isOff ? '✅ ยกเลิก' : '🏖️ ตั้ง'}วัน${TH_DAYS[dow]}เป็นวันหยุด`);
      };

      const resetDaysToWeeklyOff = () => {
        if (!confirm('รีเซ็ตตารางวัน? สถานะวันลา/นักขัตฤกษ์และชั่วโมงหักจะถูกล้าง')) return;
        setDays(prev => prev.map(d => ({
          ...d,
          type: weeklyOff.includes(d.dow) ? 'holiday' : 'work',
          unpaidHours: 0,
        })));
        showToast('🔄 รีเซ็ตตารางตามวันหยุดที่เลือกแล้ว');
      };

      const updateDay = (idx, patch) => {
        setDays(prev => prev.map((d, i) => (i === idx ? { ...d, ...patch } : d)));
      };

      const addExtra = (name = '', amt = '') => setExtras(prev => [...prev, { id: uid(), name, amt: String(amt) }]);
      const updateExtra = (id, patch) => setExtras(prev => prev.map(e => (e.id === id ? { ...e, ...patch } : e)));
      const removeExtra = (id) => setExtras(prev => prev.filter(e => e.id !== id));

      // ===== AUTO IMPORT =====
      const handleImportTimeFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setImporting(true);
        try {
          const ext = file.name.split('.').pop().toLowerCase();
          let result;
          if (ext === 'xlsx' || ext === 'xls') {
            const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
            result = parseExcelFile(wb);
          } else if (ext === 'csv') {
            const wb = XLSX.read(await file.text(), { type: 'string' });
            result = parseExcelFile(wb);
          } else if (ext === 'pdf') {
            if (!window.pdfjsLib) throw new Error('โหลดตัวอ่าน PDF ไม่สำเร็จ');
            result = await parsePdfFile(file);
          } else {
            showToast('⚠️ รองรับ .xlsx, .xls, .csv, .pdf เท่านั้น');
            return;
          }

          const parsed = result.rows.sort((a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d));
          if (!parsed.length) {
            setImportPreview([]);
            setImportLog(`⚠️ ${result.info}`);
            showToast('⚠️ อ่านไฟล์ได้แต่ไม่พบข้อมูลวันที่');
            return;
          }

          // เลือกงวดที่มีวันในไฟล์มากที่สุด (งวดแรก 1–15 · งวดหลัง 16–สิ้นเดือน)
          const cnt = {};
          parsed.forEach(r => {
            const k = `${r.y}-${pad(r.m)}-${r.d <= 15 ? 1 : 2}`;
            cnt[k] = (cnt[k] || 0) + 1;
          });
          const topKey = Object.entries(cnt).sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))[0][0];
          const [ty, tm, th] = topKey.split('-').map(Number);
          const target = generatePeriodInfo(ty, tm, th);
          const switched = target.key !== currentPeriod.key;

          let base = days;
          if (switched) {
            const existing = records.find(r => r.key === target.key);
            base = existing ? existing.days : generateInitialDays(target, weeklyOff);
            setExtras(existing ? (existing.extras || []).map(x => ({ id: uid(), name: x.name, amt: String(x.amt) })) : []);
            setCurrentPeriod(target);
            setSelectedMonth(`${ty}-${pad(tm)}`);
            setSelectedHalf(th);
          }

          const std = settings.hours || 8;
          const map = {};
          parsed.forEach(r => { map[`${r.y}-${pad(r.m)}-${pad(r.d)}`] = r; });
          const newDays = base.map(day => {
            const r = map[day.dateStr];
            if (!r) return day;
            const res = classifyRow(r, std);
            return { ...day, type: res.type, unpaidHours: res.unpaidHours };
          });
          setDays(newDays);

          const inP = (r) => r.y === target.y && r.m === target.m && r.d >= target.startDay && r.d <= target.endDay;
          const preview = parsed.map(r => ({ ...r, ...classifyRow(r, std), inPeriod: inP(r) }));
          setImportPreview(preview);
          const usedRows = preview.filter(r => r.inPeriod);
          const outsideRows = preview.filter(r => !r.inPeriod);
          const warnCount = usedRows.filter(r => r.warn).length;
          const periodLen = target.endDay - target.startDay + 1;
          setImportLog(
            `✅ ${file.name}: อ่านได้ ${parsed.length} วัน → ใช้กับงวด ${target.label} จำนวน ${usedRows.length}/${periodLen} วัน` +
            (outsideRows.length ? ` · ข้ามวันนอกงวด ${outsideRows.length} วัน (${outsideRows.map(r => `${pad(r.d)}/${pad(r.m)}`).join(', ')})` : '') +
            (switched ? ' · เลือกงวดให้อัตโนมัติ' : '') +
            ` | ${result.info}`
          );
          showToast(warnCount
            ? `📥 นำเข้า ${usedRows.length} วัน · ⚠️ มี ${warnCount} วันควรตรวจสอบ`
            : `📥 นำเข้า ${usedRows.length} วันสำเร็จ`);
        } catch (err) {
          console.error(err);
          showToast('⚠️ อ่านไฟล์ไม่สำเร็จ: ' + err.message);
        } finally {
          setImporting(false);
        }
      };

      const handleCalculate = () => {
        setFlash(true);
        setTimeout(() => setFlash(false), 900);
        slipRef.current && slipRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        showToast(`🧮 คำนวณงวด ${calculation.period.label} · สุทธิ ${formatMoney(calculation.net)} ฿`);
      };

      const handleSaveRecord = () => {
        const filtered = records.filter(r => r.key !== calculation.key);
        persistRecords([calculation, ...filtered]);
        showToast(`💾 บันทึกงวด ${calculation.period.label} เรียบร้อยแล้ว`);
      };

      const loadRecord = (r) => {
        setCurrentPeriod(r.period);
        setSelectedMonth(`${r.period.y}-${pad(r.period.m)}`);
        setSelectedHalf(r.period.half);
        setDays(r.days);
        setExtras((r.extras || []).map(e => ({ id: uid(), name: e.name, amt: String(e.amt) })));
        setImportLog('');
        setImportPreview([]);
        setCurrentTab('calc');
        showToast(`📂 เปิดงวด ${r.period.label} เพื่อแก้ไข`);
      };

      const deleteRecord = (key) => {
        if (!confirm('ต้องการลบงวดนี้ใช่หรือไม่?')) return;
        persistRecords(records.filter(r => r.key !== key));
        showToast('🗑️ ลบงวดเรียบร้อย');
      };

      const handleSaveSettings = () => {
        const parsed = { ...settings };
        Object.keys(draft).forEach(k => {
          parsed[k] = NUMERIC_KEYS.includes(k) ? (parseFloat(draft[k]) || 0) : draft[k];
        });
        if (!parsed.hours) parsed.hours = 8;
        setSettings(parsed);
        localStorage.setItem('pst_settings', JSON.stringify(parsed));
        showToast('✅ บันทึกการตั้งค่าแล้ว');
      };

      const handleBackup = () => {
        const blob = new Blob([JSON.stringify({ app: 'PaySlipTracker', version: 6, exportedAt: new Date().toISOString(), settings, records, weeklyOff }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `payslip-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('⬇️ ดาวน์โหลดไฟล์สำรองแล้ว');
      };

      const handleRestore = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (Array.isArray(data.records)) persistRecords(data.records);
            if (data.settings) {
              const s = { ...DEFAULT_SETTINGS, ...data.settings };
              setSettings(s);
              localStorage.setItem('pst_settings', JSON.stringify(s));
            }
            if (Array.isArray(data.weeklyOff)) {
              setWeeklyOff(data.weeklyOff);
              localStorage.setItem('pst_weekly_off', JSON.stringify(data.weeklyOff));
            }
            showToast(`⬆️ กู้คืนข้อมูลสำเร็จ (${(data.records || []).length} งวด)`);
          } catch {
            showToast('⚠️ ไฟล์ไม่ถูกต้อง');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleClearAll = () => {
        if (!confirm('ล้างประวัติทั้งหมด? การกระทำนี้ย้อนกลับไม่ได้')) return;
        persistRecords([]);
        showToast('🗑️ ล้างประวัติทั้งหมดแล้ว');
      };

      const goal = settings.incomeGoal || 0;
      const otherHalfNet = records
        .filter(r => r.period.y === currentPeriod.y && r.period.m === currentPeriod.m && r.key !== calculation.key)
        .reduce((s, r) => s + r.net, 0);
      const monthNet = calculation.net + otherHalfNet;
      const pct = goal > 0 ? Math.round((monthNet / goal) * 1000) / 10 : 0;
      const progressWidth = goal > 0 ? Math.min(100, Math.max(0, (monthNet / goal) * 100)) : 0;
      const isReached = goal > 0 && monthNet >= goal;

      const monthGroups = useMemo(() => {
        const g = {};
        records.forEach(r => {
          const k = `${r.period.y}-${pad(r.period.m)}`;
          if (!g[k]) g[k] = { key: k, y: r.period.y, m: r.period.m, items: [] };
          g[k].items.push(r);
        });
        return Object.values(g).sort((a, b) => b.key.localeCompare(a.key)).map(x => ({
          ...x,
          items: x.items.sort((a, b) => a.period.half - b.period.half),
          gross: x.items.reduce((s, r) => s + r.gross, 0),
          ded: x.items.reduce((s, r) => s + r.ded, 0),
          net: x.items.reduce((s, r) => s + r.net, 0),
        }));
      }, [records]);

      useEffect(() => {
        if (records.length >= 2) {
          if (!records.find(r => r.key === cmpA)) setCmpA(records[1].key);
          if (!records.find(r => r.key === cmpB)) setCmpB(records[0].key);
        }
      }, [records]);
      const recA = records.find(r => r.key === cmpA);
      const recB = records.find(r => r.key === cmpB);
      const CMP_ROWS = [
        ['วันจ่ายเงิน (วัน)', r => r.stats.paidDays, false, true],
        ['ค่าแรงรายวัน', r => r.dailyWage],
        ['ค่าวันหยุด/นักขัตฤกษ์', r => r.pubWage || 0],
        ['รายได้เพิ่มเติม', r => r.extraSum || 0],
        ['รวมรายได้', r => r.gross],
        ['ประกันสังคม', r => r.sso, true],
        ['รวมเงินหัก', r => r.ded, true],
        ['เงินสุทธิ', r => r.net],
      ];

      const TABS = [
        ['calc', '🧮 คำนวณงวดใหม่'],
        ['hist', '📚 ประวัติรายเดือน'],
        ['cmp', '📊 เปรียบเทียบงวด'],
        ['set', '⚙️ ตั้งค่า'],
      ];

      const SETTING_FIELDS = [
        { k: 'rate', label: 'ค่าแรงต่อวัน (บาท)' },
        { k: 'hours', label: 'ชั่วโมงทำงานต่อวัน' },
        { k: 'holMult', label: '🎌 ตัวคูณนักขัตฤกษ์/OT1 (ทำงาน) — 2 = ได้ 2 แรง' },
        { k: 'sso', label: 'ประกันสังคม (%)' },
        { k: 'ssoCap', label: 'เพดานประกันสังคมต่องวด (บาท)' },
        { k: 'ssoBase', label: 'ฐานการคิดประกันสังคม', select: [['wage', 'ค่าแรงรายวันเท่านั้น'], ['all', 'ค่าแรงรายวัน + รายได้เพิ่มเติม']] },
        { k: 'tax', label: 'ภาษีหัก ณ ที่จ่ายต่องวด (บาท)' },
        { k: 'othName', label: 'ชื่อรายการหักอื่นๆ', text: true },
        { k: 'oth', label: 'ยอดเงินหักอื่นๆ (บาท)' },
        { k: 'quickName', label: '⚡ ปุ่มลัดรายได้เพิ่มเติม — ชื่อ', text: true },
        { k: 'quickAmt', label: '⚡ ปุ่มลัดรายได้เพิ่มเติม — จำนวนเงิน (บาท)' },
        { k: 'incomeGoal', label: '🎯 เป้าหมายรายได้ต่อเดือน (บาท)' },
      ];

      return (
        <div className="min-h-screen flex flex-col">
          {toast && (
            <div className="no-print fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900 border border-slate-700 text-white text-xs sm:text-sm font-semibold shadow-2xl max-w-[90vw] text-center">
              {toast}
            </div>
          )}

          <header className="no-print sticky top-0 z-40 backdrop-blur-md border-b bg-white/90 border-slate-200 dark:bg-slate-900/90 dark:border-slate-800">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-3 min-w-0">
                <span className="w-11 h-11 rounded-2xl grid place-items-center text-2xl bg-gradient-to-br from-blue-500 to-indigo-600 shadow-lg shadow-blue-600/30">💰</span>
                <div className="min-w-0">
                  <h1 className="font-bold text-base sm:text-lg leading-tight truncate">PaySlip Tracker {APP_VERSION}</h1>
                  <p className="hidden sm:block text-[11px] text-slate-400">อัปโหลดไฟล์ลงเวลา → คำนวณเงินอัตโนมัติ</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setIsDark(!isDark)} title="สลับโหมด"
                  className="w-10 h-10 grid place-items-center rounded-xl border bg-slate-100 border-slate-300 text-slate-600 dark:bg-slate-800 dark:border-slate-700 dark:text-amber-400">
                  <Ico name={isDark ? 'sun' : 'moon'} className="w-5 h-5" />
                </button>
                <div className="flex items-center gap-2 pl-1.5 pr-3 py-1.5 rounded-2xl border bg-slate-100 border-slate-300 dark:bg-slate-800 dark:border-slate-700">
                  <span className="w-7 h-7 grid place-items-center rounded-full bg-blue-600 text-white"><Ico name="user" className="w-4 h-4" /></span>
                  <span className="text-xs sm:text-sm whitespace-nowrap">ผู้ใช้ทั่วไป (Guest)</span>
                </div>
              </div>
            </div>
            <div className="max-w-5xl mx-auto px-4 pb-2 flex gap-2 overflow-x-auto no-scrollbar">
              {TABS.map(([k, label]) => (
                <button key={k} onClick={() => setCurrentTab(k)}
                  className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${currentTab === k ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                  {label}{k === 'hist' ? ` (${records.length})` : ''}
                </button>
              ))}
            </div>
          </header>

          <main className="flex-1 w-full max-w-5xl mx-auto p-4 space-y-5">
            {currentTab === 'calc' && (
              <>
                <div className={`${CARD} no-print`}>
                  <SectionHead num="1" title="เลือกงวดจ่ายค่าแรง + นำเข้าไฟล์ลงเวลา" desc="อัปโหลดไฟล์ Excel/PDF จากเครื่องสแกนนิ้ว ระบบจะเลือกงวดและเติมวันทำงานให้อัตโนมัติ" />
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                    <div>
                      <label className={LABEL}>เดือน / ปี (ค.ศ.)</label>
                      <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className={INPUT} />
                    </div>
                    <div>
                      <label className={LABEL}>งวดการคำนวณ</label>
                      <select value={selectedHalf} onChange={e => setSelectedHalf(Number(e.target.value))} className={INPUT}>
                        <option value={1}>งวดแรก (1–15) → จ่ายวันที่ 20</option>
                        <option value={2}>งวดหลัง (16–สิ้นเดือน 30/31) → จ่ายวันที่ 5</option>
                      </select>
                    </div>
                    <button onClick={handleGenerateDays} className="py-3 px-4 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold">
                      สร้างตารางวัน 🗓️
                    </button>
                  </div>

                  <div className="mt-4 p-4 rounded-2xl border-2 border-dashed border-emerald-300 bg-emerald-50 dark:bg-emerald-950/20 dark:border-emerald-800">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">

                    </div>
                  </div>

                  <div className="mt-4 p-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 flex justify-between items-center">
                    <div>
                      <span className="text-sm text-emerald-600 dark:text-emerald-400 font-bold block">เงินสุทธิ</span>
                      <span className="text-[11px] text-slate-400">ยอดเงินรับจริง</span>
                    </div>
                    <div className="text-2xl sm:text-3xl font-bold font-mono text-emerald-600 dark:text-emerald-400">{formatMoney(calculation.net)} ฿</div>
                  </div>
                </div>

                <div className="no-print space-y-5">
                  <DistributionChart calc={calculation} isDark={isDark} />
                  <DayTypeChart calc={calculation} isDark={isDark} />
                  <TrendChart list={trendList} isDark={isDark} />
                </div>
              </>
            )}

            {currentTab === 'hist' && (
              <div className={CARD}>
                <SectionHead icon="📚" title="ประวัติรายเดือน" pill={<Pill color="blue">{records.length} งวด</Pill>} desc="รวมยอดแต่ละเดือนจากทั้ง 2 งวด · กดที่งวดเพื่อเปิดแก้ไข" />
                {monthGroups.length === 0 ? (
                  <div className="py-10 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 text-center text-sm text-slate-400">ยังไม่มีข้อมูลที่บันทึกไว้</div>
                ) : (
                  <div className="space-y-4">
                    {monthGroups.map(g => (
                      <div key={g.key} className="rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                        <div className="p-3 flex flex-wrap justify-between items-center gap-2 bg-slate-100 dark:bg-slate-900/70">
                          <strong className="text-sm">{TH_MONTHS_FULL[g.m - 1]} {g.y + 543}</strong>
                          <div className="text-xs text-slate-500 dark:text-slate-400">
                            รายได้ {formatMoney(g.gross)} · หัก {formatMoney(g.ded)} · <span className="font-mono font-bold text-emerald-600 dark:text-emerald-400 text-sm">สุทธิ {formatMoney(g.net)} ฿</span>
                          </div>
                        </div>
                        <div className="divide-y divide-slate-200 dark:divide-slate-800">
                          {g.items.map(r => (
                            <div key={r.key} className="p-3 flex justify-between items-center gap-2 text-xs">
                              <button onClick={() => loadRecord(r)} className="text-left flex-1 min-w-0">
                                <strong>{r.period.half === 1 ? 'งวดแรก' : 'งวดหลัง'} · {r.period.label}</strong>
                                <div className="text-[11px] text-slate-400">
                                  {r.stats.paidDays} วันจ่าย · รายได้ {formatMoney(r.gross)} ฿{r.extraSum > 0 ? ` (เพิ่มเติม ${formatMoney(r.extraSum)})` : ''} · หัก {formatMoney(r.ded)} ฿ · จ่าย {r.period.payLabel}
                                </div>
                              </button>
                              <div className="font-mono font-bold text-emerald-600 dark:text-emerald-400 text-sm whitespace-nowrap">{formatMoney(r.net)} ฿</div>
                              <button onClick={() => loadRecord(r)} title="แก้ไข" className="p-2 rounded-lg text-blue-500 hover:bg-blue-500/10"><Ico name="edit" /></button>
                              <button onClick={() => deleteRecord(r.key)} title="ลบ" className="p-2 rounded-lg text-rose-500 hover:bg-rose-500/10"><Ico name="trash" /></button>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {currentTab === 'cmp' && (
              <>
                <div className={CARD}>
                  <SectionHead icon="📊" title="เปรียบเทียบงวด" desc="เลือก 2 งวดที่บันทึกไว้เพื่อดูความแตกต่าง" />
                  {records.length < 2 ? (
                    <div className="py-10 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 text-center text-sm text-slate-400">ต้องบันทึกอย่างน้อย 2 งวดจึงจะเปรียบเทียบได้</div>
                  ) : (
                    <>
                      <div className="grid grid-cols-2 gap-3 mb-4">
                        <div>
                          <label className={LABEL}>งวด A</label>
                          <select value={cmpA} onChange={e => setCmpA(e.target.value)} className={INPUT}>
                            {records.map(r => <option key={r.key} value={r.key}>{r.period.label}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className={LABEL}>งวด B</label>
                          <select value={cmpB} onChange={e => setCmpB(e.target.value)} className={INPUT}>
                            {records.map(r => <option key={r.key} value={r.key}>{r.period.label}</option>)}
                          </select>
                        </div>
                      </div>
                      {recA && recB && (
                        <div className="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-700">
                          <table className="w-full text-xs sm:text-sm">
                            <thead className="bg-slate-100 dark:bg-slate-900/70">
                              <tr>
                                <th className="p-2.5 text-left">รายการ</th>
                                <th className="p-2.5 text-right">A</th>
                                <th className="p-2.5 text-right">B</th>
                                <th className="p-2.5 text-right">ผลต่าง (B−A)</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
                              {CMP_ROWS.map(([label, fn, invert, isDay]) => {
                                const a = fn(recA), b = fn(recB), d = b - a;
                                const good = invert ? d < 0 : d > 0;
                                const color = d === 0 ? 'text-slate-400' : good ? 'text-emerald-500' : 'text-rose-500';
                                const fmt = (v) => isDay ? v : formatMoney(v);
                                return (
                                  <tr key={label} className={label === 'เงินสุทธิ' ? 'font-bold' : ''}>
                                    <td className="p-2.5">{label}</td>
                                    <td className="p-2.5 text-right font-mono">{fmt(a)}</td>
                                    <td className="p-2.5 text-right font-mono">{fmt(b)}</td>
                                    <td className={`p-2.5 text-right font-mono ${color}`}>{d > 0 ? '+' : ''}{fmt(isDay ? d : Number(d.toFixed(2)))}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </>
                  )}
                </div>

                {recA && recB && records.length >= 2 && (
                  <div className={CARD}>
                    <SectionHead icon="📉" title="กราฟเปรียบเทียบ A / B" />
                    <ChartBox type="bar" height={300} deps={[isDark]}
                      data={{
                        labels: ['รวมรายได้', 'รวมเงินหัก', 'เงินสุทธิ'],
                        datasets: [
                          { label: `A: ${recA.period.label}`, data: [recA.gross, recA.ded, recA.net], backgroundColor: '#64748b', borderRadius: 6 },
                          { label: `B: ${recB.period.label}`, data: [recB.gross, recB.ded, recB.net], backgroundColor: '#3b82f6', borderRadius: 6 },
                        ],
                      }}
                      options={{
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: themeColors(isDark).legend } }, tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${formatMoney(ctx.raw)} ฿` } } },
                        scales: {
                          x: { ticks: { color: themeColors(isDark).tick }, grid: { display: false } },
                          y: { beginAtZero: true, ticks: { color: themeColors(isDark).tick }, grid: { color: themeColors(isDark).grid } },
                        },
                      }} />
                  </div>
                )}

                <TrendChart list={[...records].sort((a, b) => a.key.localeCompare(b.key)).slice(-12)} isDark={isDark} title="แนวโน้มทุกงวดที่บันทึก" />
              </>
            )}

            {currentTab === 'set' && (
              <>
                <div className={CARD}>
                  <div className="mb-5">
                    <div className="flex items-center gap-3">
                      <span className="text-blue-500"><Ico name="gear" className="w-6 h-6" /></span>
                      <h2 className="text-lg font-bold">ตั้งค่าอัตราการคำนวณเงินเดือน</h2>
                    </div>
                    <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">ค่าเหล่านี้จะถูกบันทึกในเครื่องและใช้คำนวณอัตโนมัติในทุกงวด</p>
                  </div>

                  <div className="space-y-5">
                    {SETTING_FIELDS.map(f => (
                      <div key={f.k}>
                        <label className={LABEL}>{f.label}</label>
                        {f.select ? (
                          <select value={draft[f.k]} onChange={e => setDraft({ ...draft, [f.k]: e.target.value })} className={`${INPUT} font-semibold`}>
                            {f.select.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                          </select>
                        ) : (
                          <input type={f.text ? 'text' : 'number'} inputMode={f.text ? 'text' : 'decimal'}
                            value={draft[f.k] ?? ''} onChange={e => setDraft({ ...draft, [f.k]: e.target.value })}
                            className={`${INPUT} ${f.text ? 'font-semibold' : 'font-mono'}`} />
                        )}
                      </div>
                    ))}
                  </div>

                  <button onClick={handleSaveSettings}
                    className="mt-6 inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold shadow-lg shadow-blue-600/30">
                    <Ico name="save" className="w-5 h-5" /> บันทึกการตั้งค่า
                  </button>
                </div>

                <div className={CARD}>
                  <h2 className="text-lg font-bold">สำรองข้อมูลและจัดการประวัติ</h2>
                  <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">ดาวน์โหลดไฟล์สำรองเก็บไว้ในเครื่อง หรือล้างประวัติทั้งหมด</p>
                  <div className="flex flex-wrap gap-3">
                    <button onClick={handleBackup} className={BTN_OUTLINE}><Ico name="download" className="w-5 h-5" /> ดาวน์โหลดไฟล์สำรอง (.json)</button>
                    <button onClick={() => fileRef.current && fileRef.current.click()} className={BTN_OUTLINE}><Ico name="upload" className="w-5 h-5" /> กู้คืนข้อมูลจากไฟล์</button>
                    <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={handleRestore} />
                    <button onClick={handleClearAll}
                      className="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl border text-sm font-semibold border-rose-400/60 text-rose-500 hover:bg-rose-500/10 dark:border-rose-800/70 dark:text-rose-400">
                      <Ico name="trash" className="w-5 h-5" /> ล้างประวัติทั้งหมด
                    </button>
                  </div>
                </div>
              </>
            )}
          </main>

          <footer className="no-print mt-8 py-5 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400 px-4">
            PaySlip Tracker {APP_VERSION} Auto Import © {new Date().getFullYear()} · อัปโหลดไฟล์ลงเวลาแล้วคำนวณอัตโนมัติ
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
