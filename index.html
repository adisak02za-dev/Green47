<script>
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);
const APP_VERSION='v6.2-fixed-blank';

// helpers
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
function formatMoney(v){const n=Number(v)||0;return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtHM(h){const mins=Math.round((Number(h)||0)*60);return `${Math.floor(mins/60)}:${pad(mins%60)}`;}
const hmOrDash=h=>h>0.001?fmtHM(h):'-';
const round4=x=>Math.round((Number(x)||0)*10000)/10000;
const TH_DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAY_TYPES={
  work:{label:'✅ วันทำงาน',pay:1},
  pubwork:{label:'🎌 นักขัต/OT 2แรง',pay:1},
  puboff:{label:'🎏 นักขัตหยุด 1แรง',pay:1},
  holiday:{label:'🏖️ วันหยุด 0บาท',pay:0},
  sick:{label:'🤒 ลาป่วย',pay:1},
  personal:{label:'📄 ลากิจ',pay:1},
  annual:{label:'🌴 พักร้อน',pay:1},
  absent:{label:'❌ ขาดงาน',pay:0},
  unpaid:{label:'⛔ ลาไม่รับค่าจ้าง',pay:0},
};
const DEFAULT_SETTINGS={rate:412,hours:8,holMult:2,sso:5,ssoCap:750,ssoBase:'wage',tax:0,othName:'หักอื่นๆ',oth:0,quickName:'Incentive',quickAmt:250,incomeGoal:15000};

function generatePeriodInfo(y,m,half){
  const last=new Date(y,m,0).getDate();
  const s=half===1?1:16, e=half===1?15:last;
  const pay=half===1?new Date(y,m-1,20):new Date(y,m,5);
  return {y,m,half,startDay:s,endDay:e,key:`${y}-${pad(m)}-H${half}`,label:`${s}–${e} ${TH_MONTHS[m-1]} ${y+543}`,payLabel:`${pay.getDate()} ${TH_MONTHS[pay.getMonth()]} ${pay.getFullYear()+543}`};
}
function generateInitialDays(period,off=[]){
  const days=[];
  for(let d=period.startDay;d<=period.endDay;d++){
    const dt=new Date(period.y,period.m-1,d);
    days.push({d,dow:dt.getDay(),dateStr:`${period.y}-${pad(period.m)}-${pad(d)}`,type:off.includes(dt.getDay())?'holiday':'work',unpaidHours:0});
  }
  return days;
}

// --- Thai normalize + header matching FIXED ---
const PUA={'\uF700':'\u0E10'};
const normTh=s=>String(s??'').replace(/[\u200B-\u200D\uFEFF]/g,'').normalize('NFC');
const hdrKey=s=>normTh(s).toLowerCase().replace(/\s+/g,'').replace(/[()]/g,'');

function matchHeaderKey(raw){
  const k=hdrKey(raw); if(!k) return null;
  if(k.includes('วันที่มีผล')) return 'date';
  if(k.includes('วันทีมีผล')) return 'date';
  if(k.includes('วันที่')) return 'date';
  if(k==='date') return 'date';
  if(k.includes('รวม')&&(k.includes('ot')||k.includes('โอที'))) return 'otTotal';
  if(k.includes('ot1.5')||k.includes('ot15')) return 'ot15';
  if(k.includes('ot1')) return 'ot1';
  if(k.includes('ot2')) return 'ot2';
  if(k.includes('ot3')) return 'ot3';
  if(k.includes('ไม่รูด')&&k.includes('เข้า')) return 'noIn';
  if(k.includes('ไม่รูด')&&k.includes('ออก')) return 'noOut';
  if(k.includes('จำนวนทำงาน')) return 'work';
  if(k.includes('มาสาย')) return 'late';
  if(k.includes('กลับก่อน')) return 'early';
  if(k.includes('ขาดงาน')) return 'absent';
  if(k.includes('ลาป่วย')) return 'sick';
  if(k.includes('ลากิจ')) return 'personal';
  if(k.includes('พักร้อน')) return 'annual';
  if(k.includes('ลาอื่น')) return 'otherLeave';
  if(k.includes('ประเภท')) return 'type';
  if(k.includes('เวลาเข้า')) return 'timeIn';
  if(k.includes('เวลาออก')) return 'timeOut';
  if(k==='กะ') return 'shift';
  if(k.includes('กะ')) return 'shift';
  return null;
}
function fixYear(y,m,d){
  if(y<100) y+=y>=40?2500:2000;
  if(y>2400) y-=543;
  if(m<1||m>12||d<1||d>31) return null;
  return {y,m,d};
}
function parseDateStr(s){
  const str=normTh(s);
  let m=str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return fixYear(+m[3],+m[2],+m[1]);
  m=str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return fixYear(+m[1],+m[2],+m[3]);
  m=str.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m) return fixYear(+m[3],+m[2],+m[1]);
  return null;
}
function parseDateCell(rawV,textV){
  if(rawV instanceof Date) return fixYear(rawV.getFullYear(),rawV.getMonth()+1,rawV.getDate());
  if(typeof rawV==='number'&&rawV>20000&&rawV<100000&&window.XLSX){
    try{const o=XLSX.SSF.parse_date_code(rawV); if(o) return fixYear(o.y,o.m,o.d);}catch{}
  }
  return parseDateStr(textV)||parseDateStr(rawV);
}
function hoursFromText(s){
  const str=normTh(s).trim();
  if(!str||/^[-–—]+$/.test(str)) return 0;
  const m=str.match(/(\d{1,3})\s*:\s*(\d{2})(?!\d)/);
  if(m) return (+m[1])+ (+m[2])/60;
  const n=parseFloat(str.replace(/[^\d.]/g,''));
  return isNaN(n)?0:n;
}
function cellsToRecord(dt,cells,colsSet,rowText,shiftText){
  const h=k=>hoursFromText(cells[k]||'');
  const txt=normTh(rowText||'');
  const timeTxt=`${cells.timeIn||''} ${cells.timeOut||''}`.trim();
  const hasTime=timeTxt?/\d{1,2}:\d{2}/.test(timeTxt):(h('work')>0);
  let typeText=normTh(cells.type||'').trim();
  if(!typeText){
    const mm=txt.replace(/\s+/g,'').match(/วันหยุดนักขัตฤกษ์|นักขัตฤกษ์|วันหยุด|วันทำงาน/);
    typeText=mm?mm[0]:'';
  }
  return {...dt,typeText,shiftText:shiftText||cells.shift||'',timeTxt,work:h('work'),late:h('late'),early:h('early'),absent:h('absent'),sick:h('sick'),personal:h('personal'),annual:h('annual'),otherLeave:h('otherLeave'),ot1:h('ot1'),ot15:h('ot15'),ot2:h('ot2'),ot3:h('ot3'),otTotal:h('otTotal'),hasTime:hasTime||h('work')>0,cols:[...colsSet],rowText:txt};
}
function classifyRow(r,std=8){
  const t=normTh(r.typeText||'').replace(/\s+/g,'');
  const isPub=/นักขัต|ขัตฤกษ์|ประเพณี/.test(t);
  const isHoliday=/วันหยุด/.test(t)&&!isPub;
  const work=r.work||0, hasWork=work>=0.01;
  const lateEarly=(r.late||0)+(r.early||0), absentH=r.absent||0;
  const otVal=Math.max(r.ot1||0,r.otTotal||0,r.ot15||0,r.ot2||0,r.ot3||0);
  const cols=new Set(r.cols||[]);
  const otValid=(cols.has('ot1')&&cols.has('otTotal'))?(r.ot1>0&&r.otTotal>0):otVal>0;
  if(isPub){
    if(r.hasTime||hasWork||otValid) return {type:'pubwork',unpaidHours:round4(Math.min(lateEarly,std)),note:`นักขัตมาทำงาน${otValid?` OT ${fmtHM(otVal)}`:''} →2แรง`,warn:''};
    return {type:'puboff',unpaidHours:0,note:'นักขัตไม่ได้มา →1แรง',warn:''};
  }
  if(otValid&&!hasWork&&!isHoliday) return {type:'pubwork',unpaidHours:0,note:`OT ${fmtHM(otVal)}ล้วน →2แรง`,warn:r.hasTime?'':'ไม่มีสแกน'};
  if(r.sick>0) return {type:'sick',unpaidHours:0,note:`ลาป่วย ${fmtHM(r.sick)}`,warn:''};
  if(r.personal>0) return {type:'personal',unpaidHours:0,note:`ลากิจ ${fmtHM(r.personal)}`,warn:''};
  if(r.annual>0) return {type:'annual',unpaidHours:0,note:`พักร้อน ${fmtHM(r.annual)}`,warn:''};
  if(r.otherLeave>0) return {type:'personal',unpaidHours:0,note:`ลาอื่นๆ ${fmtHM(r.otherLeave)}`,warn:''};
  if(isHoliday){
    if(hasWork||r.hasTime){
      const missing=hasWork?Math.max(0,std-work):0;
      const unpaid=Math.max(lateEarly+absentH,missing);
      return {type:'work',unpaidHours:round4(unpaid),note:`วันหยุดแต่มาทำงาน ${hasWork?fmtHM(work):'มีสแกน'} →1แรง`,warn:''};
    }
    return {type:'holiday',unpaidHours:0,note:'วันหยุด ไม่มีงาน →0บาท',warn:''};
  }
  if(hasWork){
    const missing=Math.max(0,std-work);
    const unpaid=Math.max(lateEarly+absentH,missing);
    let note=`ทำงาน ${fmtHM(work)}`; if(unpaid>0.001) note+=` · หัก ${fmtHM(unpaid)}`; else note+=` →1แรง`;
    return {type:'work',unpaidHours:round4(Math.min(unpaid,std)),note,warn:''};
  }
  if(r.hasTime) return {type:'work',unpaidHours:round4(Math.min(lateEarly+absentH,std)),note:`มีสแกน ${r.timeTxt} →ทำงาน`,warn:'ไม่มีชั่วโมงทำงาน'};
  return {type:'absent',unpaidHours:0,note:absentH>0?`ขาดงาน ${fmtHM(absentH)}`:'ไม่มีสแกน/ชั่วโมง →ขาดงาน',warn:''};
}
function parseExcelFile(wb){
  for(const name of wb.SheetNames){
    const sheet=wb.Sheets[name];
    const txt=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:''});
    const raw=XLSX.utils.sheet_to_json(sheet,{header:1,raw:true,defval:''});
    if(txt.length<2) continue;
    let hIdx=-1, cols={}, best=0;
    for(let i=0;i<Math.min(20,txt.length);i++){
      const c={}; const row=txt[i]||[];
      for(let j=0;j<Math.min(50,row.length);j++){const k=matchHeaderKey(row[j]); if(k&&c[k]==null) c[k]=j;}
      const score=Object.keys(c).length + (c.date?10:0)+(c.type?5:0)+(c.work?5:0);
      if(score>best&&Object.keys(c).length>=2){best=score;hIdx=i;cols=c;}
      if(c.date&&c.type&&c.work) break;
    }
    if(hIdx<0) continue;
    const dc=cols.date; if(dc==null) continue;
    const colsSet=new Set(Object.keys(cols));
    const rows={};
    const start=hIdx+1;
    for(let i=start;i<txt.length;i++){
      const tr=txt[i]||[], rr=raw[i]||[];
      if(tr.every(v=>!String(v).trim())) continue;
      const dt=parseDateCell(rr[dc],tr[dc]);
      if(!dt) continue;
      const cells={};
      Object.entries(cols).forEach(([k,j])=>{
        const t=String(tr[j]??'').trim(); const v=rr[j];
        if(typeof v==='number'&&v>0&&v<1&&!/:\\d{2}/.test(t)&&['work','late','early','absent','sick','personal','annual','otherLeave','ot1','ot15','ot2','ot3','otTotal'].includes(k)){
          cells[k]=fmtHM(v*24);
        }else cells[k]=t;
      });
      const shiftText=cols.shift!=null?String(tr[cols.shift]||'').trim():'';
      const key=`${dt.y}-${dt.m}-${dt.d}`;
      const filled=Object.keys(cells).filter(k=>cells[k]).length;
      if(!rows[key]||filled>=rows[key]._filled){
        rows[key]={...cellsToRecord(dt,cells,colsSet,tr.join(' | '),shiftText),_filled:filled};
      }
    }
    const list=Object.values(rows);
    if(list.length) return {rows:list,info:`ชีต "${name}" แถวหัว ${hIdx+1} พบคอลัมน์ ${Object.keys(cols).join(',')} อ่านได้ ${list.length}วัน`};
  }
  return {rows:[],info:'ไม่พบหัวตาราง วันที่มีผล/ประเภท/จำนวนทำงาน'};
}
function calculatePayroll(period,days,settings,extras){
  let work=0,pubW=0,pubO=0,holiday=0,sick=0,personal=0,annual=0,absent=0,unpaid=0, unHr=0,ssoUnHr=0,pubUnHr=0,wageUnits=0,ssoWageUnits=0;
  days.forEach(day=>{
    const dHr=Math.max(0,Number(day.unpaidHours)||0);
    switch(day.type){
      case 'work':work++;wageUnits+=1;ssoWageUnits+=1;ssoUnHr+=dHr;unHr+=dHr;break;
      case 'pubwork':pubW++;wageUnits+=settings.holMult;pubUnHr+=dHr;unHr+=dHr;break;
      case 'puboff':pubO++;wageUnits+=1;pubUnHr+=dHr;unHr+=dHr;break;
      case 'holiday':holiday++;break;
      case 'sick':sick++;wageUnits+=1;ssoWageUnits+=1;ssoUnHr+=dHr;unHr+=dHr;break;
      case 'personal':personal++;wageUnits+=1;ssoWageUnits+=1;ssoUnHr+=dHr;unHr+=dHr;break;
      case 'annual':annual++;wageUnits+=1;ssoWageUnits+=1;ssoUnHr+=dHr;unHr+=dHr;break;
      case 'absent':absent++;break;
      case 'unpaid':unpaid++;break;
    }
  });
  const hrRate=settings.rate/(settings.hours||8);
  const ssoUnpaidCut=Number((ssoUnHr*hrRate).toFixed(2));
  const pubUnpaidCut=Number((pubUnHr*hrRate).toFixed(2));
  const dailyWage=Math.max(0,Number((ssoWageUnits*settings.rate - ssoUnpaidCut).toFixed(2)));
  const holidayWorkPay=Number((pubW*Math.max(0,settings.holMult-1)*settings.rate).toFixed(2));
  const pubHolidayPay=Math.max(0,Number(((pubW+pubO)*settings.rate - pubUnpaidCut).toFixed(2)));
  const wage=Math.max(0,Number((dailyWage+holidayWorkPay+pubHolidayPay).toFixed(2)));
  const validExtras=(extras||[]).filter(e=>Number(e.amt)>0).map(e=>({name:(e.name||'').trim()||'รายได้เพิ่มเติม',amt:Number(Number(e.amt).toFixed(2))}));
  const extraSum=Number(validExtras.reduce((s,i)=>s+i.amt,0).toFixed(2));
  const gross=Number((wage+extraSum).toFixed(2));
  const ssoBaseAmount=settings.ssoBase==='all'?Number((dailyWage+extraSum).toFixed(2)):dailyWage;
  let sso=Math.round(ssoBaseAmount*((settings.sso||0)/100));
  if(settings.ssoCap>0) sso=Math.min(sso,settings.ssoCap);
  const tax=Number((settings.tax||0).toFixed(2));
  const oth=Number((settings.oth||0).toFixed(2));
  const ded=Number((sso+tax+oth).toFixed(2));
  const net=Number((gross-ded).toFixed(2));
  return {key:period.key,period,settings,days,extras:validExtras,extraSum,stats:{work,pubW,pubO,holiday,sick,personal,annual,absent,unpaid,paidDays:work+pubW+pubO+sick+personal+annual,unpaidHours:Math.round(unHr*100)/100,wageUnits,ssoWageUnits},wage,dailyWage,holidayWorkPay,pubHolidayPay,gross,sso,ssoBaseAmount,tax,oth,ded,net};
}

function App(){
  const [isDark,setIsDark]=useState(true);
  const now=new Date();
  const defaultMonth=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const defaultHalf=now.getDate()<=15?1:2;
  const [selectedMonth,setSelectedMonth]=useState(defaultMonth);
  const [selectedHalf,setSelectedHalf]=useState(defaultHalf);
  const [settings,setSettings]=useState(DEFAULT_SETTINGS);
  const [currentPeriod,setCurrentPeriod]=useState(()=>generatePeriodInfo(now.getFullYear(),now.getMonth()+1,defaultHalf));
  const [weeklyOff,setWeeklyOff]=useState([]);
  const [days,setDays]=useState(()=>generateInitialDays(currentPeriod,[]));
  const [extras,setExtras]=useState([]);
  const [records,setRecords]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('pst_records')||'[]');}catch{return [];}
  });
  const [toast,setToast]=useState(null);
  const [importLog,setImportLog]=useState('');
  const [importPreview,setImportPreview]=useState([]);
  const [importing,setImporting]=useState(false);
  const timeFileRef=useRef(null);

  const showToast=msg=>{setToast(msg); clearTimeout(window.__t); window.__t=setTimeout(()=>setToast(null),3500);};

  useEffect(()=>{
    document.documentElement.classList.toggle('dark',isDark);
  },[isDark]);

  const calculation=useMemo(()=>calculatePayroll(currentPeriod,days,settings,extras),[currentPeriod,days,settings,extras]);

  const handleGenerate=()=>{
    const [y,m]=selectedMonth.split('-').map(Number);
    const p=generatePeriodInfo(y,m,selectedHalf);
    setCurrentPeriod(p);
    setImportLog(''); setImportPreview([]);
    const ex=records.find(r=>r.key===p.key);
    if(ex){setDays(ex.days); setExtras((ex.extras||[]).map(e=>({id:uid(),name:e.name,amt:String(e.amt)}))); showToast(`โหลดงวด ${p.label} ที่บันทึกไว้`);}
    else{setDays(generateInitialDays(p,weeklyOff)); setExtras([]); showToast(`สร้างตาราง ${p.label}`);}
  };

  const handleImport=async e=>{
    const file=e.target.files&&e.target.files[0]; e.target.value=''; if(!file) return;
    setImporting(true);
    try{
      const ext=file.name.split('.').pop().toLowerCase();
      let result;
      if(ext==='xlsx'||ext==='xls'||ext==='csv'){
        const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
        result=parseExcelFile(wb);
      }else{showToast('รองรับ xlsx/xls/csv เท่านั้น'); return;}
      const parsed=result.rows.sort((a,b)=>(a.y-b.y)||(a.m-b.m)||(a.d-b.d));
      if(!parsed.length){setImportLog('⚠️ '+result.info); showToast('อ่านไม่ได้'); return;}
      const cnt={}; parsed.forEach(r=>{const k=`${r.y}-${pad(r.m)}-${r.d<=15?1:2}`; cnt[k]=(cnt[k]||0)+1;});
      const topKey=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
      const [ty,tm,th]=topKey.split('-').map(Number);
      const target=generatePeriodInfo(ty,tm,th);
      let base=days;
      if(target.key!==currentPeriod.key){
        const ex=records.find(r=>r.key===target.key);
        base=ex?ex.days:generateInitialDays(target,weeklyOff);
        setCurrentPeriod(target); setSelectedMonth(`${ty}-${pad(tm)}`); setSelectedHalf(th);
      }
      const std=settings.hours||8;
      const map={}; parsed.forEach(r=>{map[`${r.y}-${pad(r.m)}-${pad(r.d)}`]=r;});
      const newDays=base.map(day=>{
        const r=map[day.dateStr]; if(!r) return day;
        const res=classifyRow(r,std); return {...day,type:res.type,unpaidHours:res.unpaidHours};
      });
      setDays(newDays);
      const inP=r=>r.y===target.y&&r.m===target.m&&r.d>=target.startDay&&r.d<=target.endDay;
      const preview=parsed.map(r=>({...r,...classifyRow(r,std),inPeriod:inP(r)}));
      setImportPreview(preview);
      const used=preview.filter(r=>r.inPeriod);
      setImportLog(`✅ ${file.name}: อ่านได้ ${parsed.length}วัน → ใช้กับงวด ${target.label} ${used.length}วัน | ${result.info}`);
      showToast(`📥 นำเข้า ${used.length}วันสำเร็จ`);
    }catch(err){console.error(err); showToast('อ่านไฟล์ไม่สำเร็จ: '+err.message);}
    finally{setImporting(false);}
  };

  const updateDay=(idx,patch)=>setDays(prev=>prev.map((d,i)=>i===idx?{...d,...patch}:d));
  const addExtra=()=>setExtras(p=>[...p,{id:uid(),name:'',amt:''}]);
  const updateExtra=(id,patch)=>setExtras(p=>p.map(e=>e.id===id?{...e,...patch}:e));
  const removeExtra=id=>setExtras(p=>p.filter(e=>e.id!==id));
  const saveRecord=()=>{
    const filtered=records.filter(r=>r.key!==calculation.key);
    const sorted=[...filtered,calculation].sort((a,b)=>b.key.localeCompare(a.key));
    setRecords(sorted); localStorage.setItem('pst_records',JSON.stringify(sorted));
    showToast(`💾 บันทึกงวด ${calculation.period.label}`);
  };

  return html`
    <div class="max-w-5xl mx-auto p-4 space-y-4">
      <header class="flex items-center justify-between py-3 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 grid place-items-center text-xl">💰</div>
          <div>
            <div class="font-bold">PaySlip Tracker ${APP_VERSION}</div>
            <div class="text-[11px] text-emerald-400">แก้จอขาว + อ่านตรงไฟล์ รายงานผลประมวลเวลา.xlsx (วันที่มีผล)</div>

      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
        <div class="font-bold text-sm mb-2">1. เลือกงวด + นำเข้าไฟล์ลงเวลา</div>
        <div class="grid grid-cols-3 gap-2">
          <input type="month" value=${selectedMonth} onChange=${e=>setSelectedMonth(e.target.value)} class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm" />

            <option value="1">งวดแรก 1-15 → จ่าย 20</option>
            <option value="2">งวดหลัง 16-สิ้นเดือน → จ่าย 5</option>
          </select>
          <button onClick=${handleGenerate} class="py-2 rounded-xl bg-blue-600 text-white text-sm font-bold">สร้างตาราง 🗓️</button>
        </div>
        <div class="mt-3 p-3 rounded-xl border-2 border-dashed border-emerald-600 bg-emerald-950/30 flex justify-between items-center">
          <div class="text-xs">
            <div class="font-bold text-emerald-400">📁 อัปโหลดไฟล์ รายงานผลประมวลเวลา.xlsx</div>
            <div class="text-[11px] text-slate-400">รองรับคอลัมน์ วันที่มีผล / กะ / ประเภท / เวลาเข้า-ออก / จำนวนทำงาน / มาสาย / กลับก่อน / ขาดงาน / ลา / OT</div>
            ${importLog?html`<div class="mt-1 text-[11px] bg-slate-950 p-1 rounded">${importLog}</div>`:null}
          </div>
          <div>
            <input ref=${timeFileRef} type="file" accept=".xlsx,.xls,.csv" class="hidden" onChange=${handleImport} />
            <button disabled=${importing} onClick=${()=>timeFileRef.current&&timeFileRef.current.click()} class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">${importing?'กำลังอ่าน...':'เลือกไฟล์'}</button>
          </div>
        </div>
        ${importPreview.length>0?html`
          <div class="mt-3 overflow-auto max-h-96 rounded-xl border border-slate-800 bg-slate-950">
            <table class="w-full text-[11px]">
              <thead class="bg-slate-900 sticky top-0"><tr><th class="p-2 text-left">วันที่</th><th class="p-2">กะ</th><th class="p-2">เข้า-ออก</th><th class="p-2">ประเภท</th><th class="p-2">ทำงาน</th><th class="p-2">สาย/ก่อน</th><th class="p-2">ผลเว็บ</th><th class="p-2">หัก</th></tr></thead>
              <tbody>
                ${importPreview.map(r=>html`<tr class=${r.inPeriod?'':'opacity-30'}><td class="p-1 font-mono">${pad(r.d)}/${pad(r.m)}/${r.y+543}</td><td class="p-1 text-[10px]">${r.shiftText||'-'}</td><td class="p-1 font-mono text-[10px]">${r.timeTxt||'-'}</td><td class="p-1">${r.typeText||'-'}</td><td class="p-1 font-mono">${hmOrDash(r.work)}</td><td class="p-1 font-mono">${hmOrDash(r.late+r.early)}</td><td class="p-1"><div class="font-bold">${DAY_TYPES[r.type].label}</div><div class="text-[10px] text-slate-400">${r.note}</div>${r.warn?html`<div class="text-amber-400 text-[10px]">⚠️${r.warn}</div>`:null}</td><td class="p-1 font-mono">${r.inPeriod?hmOrDash(r.unpaidHours):'-'}</td></tr>`)}
              </tbody>
            </table>
          </div>
          <div class="mt-2 text-[11px] p-2 rounded bg-blue-950 text-blue-300">สรุปไฟล์คุณ: 15=วันหยุด0฿, 21/29=วันทำงานไม่มีสแกน→ขาดงาน, 24=7:58+สาย0:02→หัก0:02, 25=5:45→หัก2:15, อื่นๆ8:00เต็ม</div>
        `:null}
      </div>

      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
        <div class="font-bold text-sm mb-2">2. บันทึกวันทำงาน — งวด ${calculation.period.label}</div>
        <div class="space-y-1">
          ${days.map((day,idx)=>html`
            <div class="flex items-center gap-2 p-2 rounded-xl bg-slate-950 border border-slate-800 text-xs">
              <div class="w-16 font-bold text-blue-400">วันที่ ${day.d}</div>

        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mt-3 text-center">

          <div class="p-2 rounded-xl bg-slate-950 border border-slate-800"><div class="text-lg font-bold mono">${calculation.stats.unpaidHours}</div><div class="text-[10px] text-slate-500">ชม.หัก</div></div>
          <div class="p-2 rounded-xl bg-slate-950 border border-slate-800"><div class="text-lg font-bold mono">${formatMoney(calculation.dailyWage)}</div><div class="text-[10px] text-slate-500">ค่าแรงรายวัน</div></div>
        </div>
      </div>

      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
        <div class="font-bold text-sm mb-2">3. รายได้เพิ่มเติม</div>
        ${extras.length===0?html`<div class="text-xs text-slate-500 py-4 text-center border-2 border-dashed border-slate-800 rounded-xl">ยังไม่มี</div>`:html`<div class="space-y-1">${extras.map(e=>html`<div class="flex gap-2"><input value=${e.name} placeholder="ชื่อรายการ" onInput=${ev=>updateExtra(e.id,{name:ev.target.value})} class="flex-1 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs" /><input type="number" value=${e.amt} placeholder="0.00" onInput=${ev=>updateExtra(e.id,{amt:ev.target.value})} class="w-24 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 mono text-xs text-right" /><button onClick=${()=>removeExtra(e.id)} class="px-2 rounded-xl bg-rose-900 text-xs">ลบ</button></div>`)}</div>`}
        <div class="flex gap-2 mt-2">
          <button onClick=${addExtra} class="px-3 py-2 rounded-xl border border-slate-700 text-xs">+ เพิ่มรายการ</button>
          ${settings.quickName?html`<button onClick=${()=>{setExtras(p=>[...p,{id:uid(),name:settings.quickName,amt:String(settings.quickAmt)}]);}} class="px-3 py-2 rounded-xl bg-amber-900/50 border border-amber-700 text-xs text-amber-300">${settings.quickName} +${formatMoney(settings.quickAmt)} ฿</button>`:null}
        </div>
        <button onClick=${saveRecord} class="mt-4 w-full py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm">💾 บันทึกงวดนี้ — สุทธิ ${formatMoney(calculation.net)} ฿</button>
      </div>

      <div class="p-4 rounded-2xl bg-white text-slate-900">
        <div class="font-bold">สรุปสลิป — งวด ${calculation.period.label} · จ่าย ${calculation.period.payLabel}</div>
        <div class="mt-3 grid grid-cols-2 gap-4 text-xs">
          <div class="border rounded-xl p-3"><div class="font-bold">รายได้</div><div class="mt-2 flex justify-between"><span>ค่าแรงรายวัน (${calculation.stats.ssoWageUnits}วัน)</span><span class="mono font-bold">${formatMoney(calculation.dailyWage)}</span></div><div class="flex justify-between text-amber-600"><span>ค่าทำงานวันหยุด/นักขัต</span><span class="mono">${formatMoney(calculation.holidayWorkPay+calculation.pubHolidayPay)}</span></div>${calculation.extras.map(ex=>html`<div class="flex justify-between text-sky-600"><span>${ex.name}</span><span class="mono">${formatMoney(ex.amt)}</span></div>`)}<div class="border-t mt-2 pt-2 flex justify-between font-bold text-emerald-600"><span>รวมรายได้</span><span class="mono">${formatMoney(calculation.gross)}</span></div></div>
          <div class="border rounded-xl p-3"><div class="font-bold">หัก</div><div class="flex justify-between"><span>ประกันสังคม ${settings.sso}%</span><span class="mono text-rose-600">-${formatMoney(calculation.sso)}</span></div><div class="border-t mt-2 pt-2 flex justify-between font-bold text-rose-600"><span>รวมหัก</span><span class="mono">-${formatMoney(calculation.ded)}</span></div></div>
        </div>
        <div class="mt-3 p-3 rounded-xl bg-emerald-50 border border-emerald-200 flex justify-between items-center"><span class="font-bold text-emerald-700">เงินสุทธิ</span><span class="text-2xl font-bold mono text-emerald-600">${formatMoney(calculation.net)} ฿</span></div>
      </div>

      <div class="text-[11px] text-slate-500 text-center pb-6">PaySlip Tracker ${APP_VERSION} — แก้จอขาวด้วย htm (ไม่ใช้ Babel) + อ่านตรงไฟล์ วันที่มีผล</div>
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu
