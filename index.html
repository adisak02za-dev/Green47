<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaySlip Tracker — คำนวณค่าแรงรายวันและสลิปเงินเดือน</title>
  <meta name="description" content="ระบบคำนวณค่าแรงรายวันและจัดการประวัติการทำงาน พร้อมกราฟสรุป Real-time และ Dark Mode" />
  <meta property="og:title" content="PaySlip Tracker — คำนวณค่าแรงรายวันและสลิปเงินเดือน" />
  <meta property="og:description" content="ระบบคำนวณค่าแรงรายวันและจัดการประวัติการทำงาน พร้อมกราฟสรุป Real-time และ Dark Mode" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Thai"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

    const DAY_TYPES = {
      work: { label: '✅ วันทำงานปกติ', pay: 1, desc: 'ได้รับค่าแรงเต็มวัน (นำไปคิดประกันสังคม)' },
      pubwork: { label: '🎌 นักขัตฤกษ์ (มาทำงาน)', pay: 1, desc: 'ทำงานวันหยุดพิเศษตามตัวคูณ (ได้ค่าแรงแต่ไม่คิดประกันสังคม)' },
      puboff: { label: '🎏 นักขัตฤกษ์ (หยุด)', pay: 1, desc: 'หยุดตามประเพณี ได้รับ 1 เท่า (ได้ค่าแรงแต่ไม่คิดประกันสังคม)' },
      holiday: { label: '🏖️ วันหยุดประจำสัปดาห์ (0 หน่วยวัน/ไม่ได้ค่าแรง)', pay: 0, desc: 'วันหยุดประจำสัปดาห์ = ไม่ได้ค่าแรง (0 หน่วยวัน / 0.00 ฿)' },
      sick: { label: '🤒 ลาป่วย (ได้เงิน)', pay: 1, desc: 'ลาป่วยตามสิทธิ์ ได้รับค่าจ้าง' },
      personal: { label: '📄 ลากิจ (ได้เงิน)', pay: 1, desc: 'ลากิจธุระจำเป็นตามสิทธิ์ ได้รับค่าจ้าง' },
      annual: { label: '🌴 ลาพักร้อน', pay: 1, desc: 'วันหยุดพักผ่อนประจำปี ได้รับค่าจ้าง' },
      absent: { label: '❌ ขาดงาน (ไม่ได้รับค่าจ้าง)', pay: 0, desc: 'ไม่มาทำงาน ตัดค่าจ้าง' },
      unpaid: { label: '⛔ ลาไม่รับค่าจ้าง', pay: 0, desc: 'ลาหยุดโดยไม่รับเงิน' },
    };

    const DEFAULT_SETTINGS = {
      rate: 412,
      hours: 8,
      holMult: 2,
      sso: 5,
      ssoCap: 750,
      tax: 0,
      oth: 0,
      othName: 'หักอื่นๆ',
      ssoBase: 'wage',
      qName: 'Incentive Audit',
      qAmt: 250,
      incomeGoal: 15000,
      recurringExtras: [
        { id: 'rec-1', name: 'Incentive Audit', amt: 250 },
      ],
    };

    function formatMoney(val) {
      const n = typeof val === 'number' && !isNaN(val) ? val : 0;
      return n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function generatePeriodInfo(year, month, half) {
      const lastDay = new Date(year, month, 0).getDate();
      const startDay = half === 1 ? 1 : 16;
      const endDay = half === 1 ? 15 : lastDay;
      const payDateObj = half === 1 ? new Date(year, month - 1, 20) : new Date(year, month, 5);
      const pad = (n) => String(n).padStart(2, '0');
      const payMonth = payDateObj.getMonth() + 1;
      const payYear = payDateObj.getFullYear();

      return {
        y: year,
        m: month,
        half,
        startDay,
        endDay,
        key: `${year}-${pad(month)}-H${half}`,
        label: `${startDay}–${endDay} ${TH_MONTHS[month - 1]} ${year + 543}`,
        payDate: `${payYear}-${pad(payMonth)}-${pad(payDateObj.getDate())}`,
        payLabel: `${payDateObj.getDate()} ${TH_MONTHS[payMonth - 1]} ${payYear + 543}`,
      };
    }

    function generateInitialDays(period) {
      const days = [];
      const pad = (n) => String(n).padStart(2, '0');
      for (let d = period.startDay; d <= period.endDay; d++) {
        const dt = new Date(period.y, period.m - 1, d);
        days.push({
          d,
          dow: dt.getDay(),
          dateStr: `${period.y}-${pad(period.m)}-${pad(d)}`,
          type: 'work',
          unpaidHours: 0,
        });
      }
      return days;
    }

    // 🎯 หัวใจหลักของการคำนวณ: ตรงตามสลิปตัวอย่าง 100%
    function calculatePayroll(period, days, settings, extras) {
      let work = 0, pubW = 0, pubO = 0, holiday = 0, sick = 0, personal = 0, annual = 0, absent = 0, unpaid = 0;
      let unHr = 0, ssoUnHr = 0, pubUnHr = 0;
      let wageUnits = 0, ssoWageUnits = 0;

      days.forEach((day) => {
        const t = day.type;
        const dHr = Math.max(0, day.unpaidHours || 0);

        switch (t) {
          case 'work':
            work++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'pubwork':
            pubW++; wageUnits += settings.holMult; pubUnHr += dHr; unHr += dHr; break;
          case 'puboff':
            pubO++; wageUnits += 1; pubUnHr += dHr; unHr += dHr; break;
          case 'holiday':
            holiday++; /* 0 wage units */ break;
          case 'sick':
            sick++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'personal':
            personal++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'annual':
            annual++; wageUnits += 1; ssoWageUnits += 1; ssoUnHr += dHr; unHr += dHr; break;
          case 'absent':
            absent++; break;
          case 'unpaid':
            unpaid++; break;
        }
      });

      const hourRate = settings.rate / (settings.hours || 8);
      const ssoUnpaidCut = Number((ssoUnHr * hourRate).toFixed(2));
      const pubUnpaidCut = Number((pubUnHr * hourRate).toFixed(2));
      const unpaidCut = Number((unHr * hourRate).toFixed(2));

      // 1. ค่าแรงรายวันปกติ (ฐานคิดประกันสังคม เช่น 11 วัน x 412 = 4,532 ฿)
      const dailyWage = Math.max(0, Number((ssoWageUnits * settings.rate - ssoUnpaidCut).toFixed(2)));

      // 2. ค่าทำงานในวันหยุด 1เท่า (เช่น 412 ฿)
      const holidayWorkUnits = pubW * Math.max(0, settings.holMult - 1);
      const holidayWorkPay = Number((holidayWorkUnits * settings.rate).toFixed(2));

      // 3. ค่าแรงทำงานในวันหยุดประเพณี (เช่น 412 ฿)
      const pubHolidayUnits = pubW + pubO;
      const pubHolidayPay = Math.max(0, Number((pubHolidayUnits * settings.rate - pubUnpaidCut).toFixed(2)));

      // รวมค่าแรง
      const wage = Math.max(0, Number((dailyWage + holidayWorkPay + pubHolidayPay).toFixed(2)));

      const validExtras = (extras || []).filter(e => (e.amt || 0) > 0);
      const extraSum = Number(validExtras.reduce((sum, item) => sum + Number(item.amt || 0), 0).toFixed(2));
      const gross = Number((wage + extraSum).toFixed(2));

      // 🎯 ประกันสังคม: คิดจาก dailyWage เท่านั้น (4,532 ฿) ไม่ใช่ยอดรวม
      const ssoBaseAmount = settings.ssoBase === 'all' ? Math.max(0, Number((dailyWage + extraSum).toFixed(2))) : dailyWage;
      let sso = Math.round(ssoBaseAmount * ((settings.sso || 0) / 100));
      if (settings.ssoCap > 0) sso = Math.min(sso, settings.ssoCap);

      const tax = Number((settings.tax || 0).toFixed(2));
      const oth = Number((settings.oth || 0).toFixed(2));
      const ded = Number((sso + tax + oth).toFixed(2));
      const net = Number((gross - ded).toFixed(2));

      return {
        key: period.key,
        period,
        settings,
        days,
        stats: { work, pubW, pubO, holiday, sick, personal, annual, absent, unpaid, paidDays: work + pubW + pubO + sick + personal + annual, unpaidHours: unHr, wageUnits, ssoWageUnits },
        wage,
        dailyWage,
        holidayWorkPay,
        pubHolidayPay,
        pubWage: holidayWorkPay + pubHolidayPay,
        unpaidCut,
        extras: validExtras,
        extraSum,
        gross,
        sso,
        ssoBaseAmount,
        tax,
        oth,
        ded,
        net,
      };
    }

    function App() {
      const [isDark, setIsDark] = useState(true);
      const now = new Date();
      const defaultMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const [selectedMonth, setSelectedMonth] = useState(defaultMonthStr);
      const [selectedHalf, setSelectedHalf] = useState(now.getDate() <= 15 ? 1 : 2);
      
      const [settings, setSettings] = useState(() => {
        try {
          const raw = localStorage.getItem('pst_settings');
          return raw ? JSON.parse(raw) : DEFAULT_SETTINGS;
        } catch { return DEFAULT_SETTINGS; }
      });

      const [currentPeriod, setCurrentPeriod] = useState(() => {
        const [y, m] = defaultMonthStr.split('-').map(Number);
        return generatePeriodInfo(y, m, now.getDate() <= 15 ? 1 : 2);
      });

      const [days, setDays] = useState(() => generateInitialDays(currentPeriod));
      const [extras, setExtras] = useState(() => {
        return (settings.recurringExtras && settings.recurringExtras.length > 0)
          ? settings.recurringExtras.map(e => ({ ...e, id: Math.random().toString(36).substring(2, 9) }))
          : [{ id: 'rec-1', name: 'Incentive Audit', amt: 250 }];
      });
      const [records, setRecords] = useState(() => {
        try {
          const raw = localStorage.getItem('pst_records');
          return raw ? JSON.parse(raw) : [];
        } catch { return []; }
      });
      const [currentTab, setCurrentTab] = useState('calc');
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      const calculation = useMemo(() => {
        return calculatePayroll(currentPeriod, days, settings, extras);
      }, [currentPeriod, days, settings, extras]);

      const handleGenerateDays = () => {
        const [y, m] = selectedMonth.split('-').map(Number);
        const p = generatePeriodInfo(y, m, selectedHalf);
        setCurrentPeriod(p);
        setDays(generateInitialDays(p));
        const initialExtras = (settings.recurringExtras && settings.recurringExtras.length > 0)
          ? settings.recurringExtras.map(e => ({ ...e, id: Math.random().toString(36).substring(2, 9) }))
          : [];
        setExtras(initialExtras);
        showToast(`🗓️ สร้างตารางงวด ${p.label} แล้ว`);
      };

      const handleQuickPreset = (preset) => {
        setDays(prev => prev.map(d => {
          if (preset === 'all_work') return { ...d, type: 'work' };
          if (preset === 'tue_holiday' && d.dow === 2) return { ...d, type: 'holiday', unpaidHours: 0 };
          if (preset === 'sun_holiday' && d.dow === 0) return { ...d, type: 'holiday', unpaidHours: 0 };
          if (preset === 'sat_sun_holiday' && (d.dow === 0 || d.dow === 6)) return { ...d, type: 'holiday', unpaidHours: 0 };
          return d;
        }));
        showToast('⚡ ปรับสถานะวันเรียบร้อย');
      };

      const handleSaveRecord = () => {
        const filtered = records.filter(r => r.key !== calculation.key);
        const updated = [calculation, ...filtered];
        setRecords(updated);
        localStorage.setItem('pst_records', JSON.stringify(updated));
        showToast(`💾 บันทึกงวด ${calculation.period.label} เรียบร้อยแล้ว`);
      };

      const handleSaveSettings = (newSet) => {
        setSettings(newSet);
        localStorage.setItem('pst_settings', JSON.stringify(newSet));
        showToast('✅ บันทึกการตั้งค่าแล้ว');
      };

      // Progress bar goal
      const goal = settings.incomeGoal || 0;
      const pct = goal > 0 ? Math.round((calculation.net / goal) * 1000) / 10 : 0;
      const progressWidth = goal > 0 ? Math.min(100, Math.max(0, (calculation.net / goal) * 100)) : 0;
      const isReached = goal > 0 && calculation.net >= goal;

      return (
        <div className={`min-h-screen ${isDark ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs font-semibold shadow-2xl">
              {toast}
            </div>
          )}

          {/* Header */}
          <header className={`border-b sticky top-0 z-40 backdrop-blur-md ${isDark ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="text-2xl">💰</span>
                <div>
                  <h1 className="font-bold text-sm sm:text-base leading-tight">PaySlip Tracker</h1>
                  <p className="text-[10px] text-slate-400">คำนวณค่าแรงรายวันและสลิปเงินเดือน</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setIsDark(!isDark)} className={`p-2 rounded-xl border text-xs font-medium ${isDark ? 'bg-slate-800 border-slate-700 hover:bg-slate-700' : 'bg-slate-100 border-slate-300 hover:bg-slate-200'}`}>
                  {isDark ? '☀️ โหมดสว่าง' : '🌙 โหมดมืด'}
                </button>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-6xl mx-auto px-4 flex gap-2 border-t border-slate-800/50 py-2">
              <button onClick={() => setCurrentTab('calc')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTab === 'calc' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                🧮 คำนวณงวดใหม่ (หน้าหลัก)
              </button>
              <button onClick={() => setCurrentTab('hist')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTab === 'hist' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                📚 ประวัติรายเดือน ({records.length})
              </button>
              <button onClick={() => setCurrentTab('set')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTab === 'set' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                ⚙️ ตั้งค่า
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-4 space-y-6">
            {currentTab === 'calc' && (
              <>
                {/* 1. เลือกงวด */}
                <div className={`p-4 rounded-2xl border ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                  <h2 className="text-sm font-bold mb-3 flex items-center gap-2">
                    <span className="w-5 h-5 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs font-bold">1</span>
                    เลือกงวดจ่ายค่าแรง
                  </h2>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">เดือน / ปี (ค.ศ.)</label>
                      <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className={`w-full px-3 py-2 rounded-xl border text-xs font-medium ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-300'}`} />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">งวดการคำนวณ</label>
                      <select value={selectedHalf} onChange={e => setSelectedHalf(Number(e.target.value))} className={`w-full px-3 py-2 rounded-xl border text-xs font-medium ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-300'}`}>
                        <option value={1}>งวดแรก (1–15) → จ่ายวันที่ 20</option>
                        <option value={2}>งวดหลัง (16–สิ้นเดือน) → จ่ายวันที่ 5</option>
                      </select>
                    </div>
                    <button onClick={handleGenerateDays} className="py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow">
                      สร้างตารางวัน 🗓️
                    </button>
                  </div>
                </div>

                {/* 2. ตารางวัน */}
                <div className={`p-4 rounded-2xl border ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                    <h2 className="text-sm font-bold flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs font-bold">2</span>
                      บันทึกข้อมูลการทำงานรายวัน ({currentPeriod.label})
                    </h2>
                    <div className="flex flex-wrap gap-1 text-xs">
                      <button onClick={() => handleQuickPreset('all_work')} className="px-2 py-1 rounded bg-slate-700/50 hover:bg-slate-700 text-[11px]">ทั้งหมด = ทำงาน</button>
                      <button onClick={() => handleQuickPreset('sun_holiday')} className="px-2 py-1 rounded bg-slate-700/50 hover:bg-slate-700 text-[11px]">อาทิตย์ = หยุด</button>
                      <button onClick={() => handleQuickPreset('sat_sun_holiday')} className="px-2 py-1 rounded bg-slate-700/50 hover:bg-slate-700 text-[11px]">เสาร์-อาทิตย์ = หยุด</button>
                    </div>
                  </div>

                  {/* แถบแจ้งเตือนเงื่อนไข */}
                  <div className={`p-3 rounded-xl border mb-3 text-xs ${isDark ? 'bg-amber-950/20 border-amber-800/50 text-amber-300' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>
                    <strong>เงื่อนไขการคำนวณ:</strong> วันหยุดประจำสัปดาห์ = <span className="underline font-bold">ไม่ได้ค่าแรง (0 หน่วยวัน / 0.00 ฿)</span> · วันนักขัตฤกษ์ = <span className="underline font-bold text-emerald-400">ได้ค่าแรงแต่ไม่นำมาคิดประกันสังคม</span>
                  </div>

                  <div className="space-y-2">
                    {days.map((day, idx) => (
                      <div key={day.d} className={`p-2.5 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs ${day.type === 'holiday' ? 'opacity-60 bg-slate-900/40' : ''} ${isDark ? 'border-slate-700/60 bg-slate-900/60' : 'border-slate-200 bg-white'}`}>
                        <div className="flex items-center gap-2 font-medium">
                          <span className="w-8 font-bold text-blue-400">วันที่ {day.d}</span>
                          <span className={`px-1.5 py-0.5 rounded text-[10px] ${day.dow === 0 || day.dow === 6 ? 'bg-rose-500/10 text-rose-400' : 'text-slate-400'}`}>{TH_DAYS[day.dow]}</span>
                        </div>

                        <div className="flex-1 flex flex-wrap items-center gap-2">
                          <select 
                            value={day.type} 
                            onChange={e => {

                    <div>
                      <h3 className="font-bold text-amber-400 text-sm">💰 รายได้เพิ่มเติมประจำงวด (ค่าเริ่มต้น)</h3>
                      <p className="text-[11px] text-slate-400">รายการนี้จะถูกดึงไปแสดงในหน้าหลักของแต่ละงวดโดยอัตโนมัติ</p>
                    </div>
                  </div>

                  <div className="space-y-2 my-3">
                    {(!settings.recurringExtras || settings.recurringExtras.length === 0) ? (
                      <p className="text-xs text-slate-400 py-3 text-center border border-dashed rounded-lg border-slate-700">ยังไม่มีรายการรายได้ประจำงวด</p>
                    ) : (
                      settings.recurringExtras.map((item, idx) => (
                        <div key={item.id || idx} className="flex gap-2 items-center text-xs">
                          <input
                            type="text"
                            value={item.name}
                            placeholder="ชื่อรายการ เช่น Incentive Audit"
                            onChange={e => {
                              const updated = [...(settings.recurringExtras || [])];
                              updated[idx] = { ...updated[idx], name: e.target.value };
                              setSettings({ ...settings, recurringExtras: updated });
                            }}
                            className="flex-1 p-2 rounded-lg border bg-slate-900 border-slate-700 font-medium"
                          />
                          <div className="relative w-32">
                            <input
                              type="number"
                              value={item.amt || ''}
                              placeholder="0.00"
                              onChange={e => {
                                const updated = [...(settings.recurringExtras || [])];
                                updated[idx] = { ...updated[idx], amt: parseFloat(e.target.value) || 0 };
                                setSettings({ ...settings, recurringExtras: updated });
                              }}
                              className="w-full p-2 pr-6 text-right rounded-lg border bg-slate-900 border-slate-700 font-mono"
                            />
                            <span className="absolute right-2 top-2 text-[10px] text-slate-400">฿</span>
                          </div>
                          <button
                            type="button"
                            onClick={() => {
                              const updated = (settings.recurringExtras || []).filter((_, i) => i !== idx);
                              setSettings({ ...settings, recurringExtras: updated });
                            }}
                            className="p-2 text-rose-400 hover:bg-rose-500/10 rounded-lg text-xs"
                          >
                            ลบ
                          </button>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="flex flex-wrap gap-2 mb-4">
                    <button
                      type="button"
                      onClick={() => {
                        const updated = [...(settings.recurringExtras || []), { id: 'rec-' + Date.now(), name: '', amt: 0 }];
                        setSettings({ ...settings, recurringExtras: updated });
                      }}
                      className="px-3 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-200 text-xs"
                    >
                      + เพิ่มรายการ
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        const updated = [...(settings.recurringExtras || []), { id: 'rec-' + Date.now(), name: 'Incentive Audit', amt: 250 }];
                        setSettings({ ...settings, recurringExtras: updated });
                      }}
                      className="px-3 py-1 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-400 text-xs"
                    >
                      + Incentive Audit (250 ฿)
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        const updated = [...(settings.recurringExtras || []), { id: 'rec-' + Date.now(), name: 'เบี้ยขยัน', amt: 500 }];
                        setSettings({ ...settings, recurringExtras: updated });
                      }}
                      className="px-3 py-1 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-xs"
                    >
                      + เบี้ยขยัน (500 ฿)
                    </button>
                  </div>
                </div>

                <button onClick={() => handleSaveSettings(settings)} className="mt-4 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-md">
                  บันทึกการตั้งค่าทั้งหมด
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
